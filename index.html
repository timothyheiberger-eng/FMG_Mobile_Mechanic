<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283c"><title>FMG Mobile Mechanic</title><style>

pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{padding:17px;font-size:20px}.dots{text-align:center;letter-spacing:15px;font-size:26px;margin:20px}.printable{padding:15px;border:1px solid #d5e1e7}hr{border:0;border-top:1px solid #dde5ea} @media(max-width:650px){.grid,.grid.three,.stats{grid-template-columns:1fr}main{padding:9px}.panel{padding:13px}header b{font-size:16px}}@media print{header,nav,.no-print,#toast{display:none!important}main{padding:0}.panel{box-shadow:none}.printable{border:0}body{background:white}}
</style></head><body><header><div>🔧 <b>FMG MOBILE MECHANIC</b><small>ENTERPRISE · CLOUD EDITION</small></div><button class="secondary" id="logout" onclick="signOut()" style="display:none">Sign out</button></header><main><nav id="nav" class="hide"></nav><div id="app"></div></main><div id="toast"></div><script>
'use strict';
const URL_BASE='https://qkcrknlzwnprafyfrdll.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_53wrE_RKFqkNrXk9IbX5Yw_LPSjtpaK';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);
const n=v=>Number(v)||0, uuid=()=>crypto.randomUUID(), today=()=>new Date().toISOString().slice(0,10);
const F={customers:'fmg_customers',vehicles:'fmg_vehicles',parts:'fmg_parts',jobs:'fmg_jobs',invoices:'fmg_invoices',items:'fmg_invoice_items',payments:'fmg_payments',settings:'fmg_settings'};
let session=null,locked=true,screen='dashboard',edit=null,records={};let settings={business_name:'FMG Mobile Mechanic',labor_rate:125,service_fee:75,default_tax_rate:.07};
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}
function msg(e){toast(e.message||String(e))}
function headers(){return {apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${session?.access_token||PUBLISHABLE_KEY}`,'Content-Type':'application/json'}}
async function req(path,opts={}){let res=await fetch(URL_BASE+path,{...opts,headers:{...headers(),...(opts.headers||{})}});let body=await res.text();let data;try{data=body?JSON.parse(body):null}catch{data=body}if(!res.ok)throw Error(data?.message||data?.error_description||data?.hint||res.statusText);return data}
async function login(ev){ev.preventDefault();let fd=new FormData(ev.target);try{let s=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:fd.get('email'),password:fd.get('password')})});session=s;let who=await req('/rest/v1/fmg_owners?select=user_id&user_id=eq.'+encodeURIComponent(s.user.id));if(!who.length)throw Error('This account is not authorized in fmg_owners');sessionStorage.setItem('fmg_session',JSON.stringify(session));locked=true;await initLock()}catch(e){session=null;sessionStorage.removeItem('fmg_session');msg(e)}}
async function refresh(){if(!session?.refresh_token)return false;try{let s=await req('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});session=s;sessionStorage.setItem('fmg_session',JSON.stringify(s));return true}catch{return false}}
async function api(table,query='?select=*',opts={}){try{return await req('/rest/v1/'+table+query,opts)}catch(e){if(session&&/JWT expired|invalid JWT/i.test(e.message)&&await refresh())return req('/rest/v1/'+table+query,opts);throw e}}
async function load(){if(locked||!session)return;try{let keys=Object.keys(F);let data=await Promise.all(keys.map(k=>api(F[k])));keys.forEach((k,i)=>records[k]=data[i]||[]);settings=records.settings[0]||settings;render()}catch(e){msg(e)}}
async function insert(table,obj){return api(F[table],'?select=*',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)})}
async function update(table,id,obj){return api(F[table],'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(obj)})}
async function remove(table,id){return api(F[table],'?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
function formField(label,name,value='',type='text',extra=''){return `<label>${esc(label)}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function selectField(label,name,options,value='',extra=''){return `<label>${esc(label)}<select name="${name}" ${extra}>${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function nav(){return ['dashboard','customers','vehicles','jobs','parts','invoices','reports','settings'].map(x=>`<button class="${screen===x?'active':''}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function go(s,id=null){screen=s;edit=id;render();scrollTo(0,0)}
function cName(id){return records.customers?.find(c=>c.id===id)?.name||'Unknown customer'}
function vName(id){let v=records.vehicles?.find(v=>v.id===id);return v?[v.year,v.make,v.model].filter(Boolean).join(' ')+' · '+(v.plate||'No tag'):'No vehicle'}
function options(k,empty='Select'){return [['',empty],...(records[k]||[]).map(x=>[x.id,k==='customers'?x.name:k==='vehicles'?vName(x.id):x.description||x.invoice_number||x.id])]}
function invoiceTotal(inv){let items=(records.items||[]).filter(x=>x.invoice_id===inv.id),sub=items.reduce((a,x)=>a+n(x.quantity)*n(x.unit_price),0),tax=items.filter(x=>x.taxable).reduce((a,x)=>a+n(x.quantity)*n(x.unit_price)*n(inv.tax_rate),0);return {sub,tax,total:sub+tax+n(inv.service_fee)}}
function invoicePaid(id){return (records.payments||[]).filter(x=>x.invoice_id===id).reduce((a,x)=>a+n(x.amount),0)}
function dashboard(){let inv=records.invoices||[],due=inv.reduce((a,i)=>a+Math.max(0,invoiceTotal(i).total-invoicePaid(i.id)),0);return `<div class="panel"><h2>Business overview</h2><div class="stats"><div class="stat">Customers<b>${records.customers?.length||0}</b></div><div class="stat">Invoices<b>${inv.length}</b></div><div class="stat">Outstanding<b>${money(due)}</b></div></div><div class="actions"><button onclick="go('customer-edit')">+ Customer</button><button onclick="go('invoice-edit')">+ Invoice</button><button onclick="go('job-edit')">+ Work order</button></div></div><div class="panel"><h2>Recent invoices</h2>${inv.slice(-8).reverse().map(i=>`<div class="list"><div>#${i.invoice_number} · ${esc(cName(i.customer_id))}<div class="muted">${esc(i.status)}</div></div><button onclick="go('invoice-view','${i.id}')">${money(invoiceTotal(i).total)}</button></div>`).join('')||'No invoices yet.'}</div>`}
function listing(k,title,display){return `<div class="panel"><h2>${title}</h2><button onclick="go('${k==='parts'?'part':k.slice(0,-1)}-edit')">+ Add</button>${(records[k]||[]).map(x=>`<div class="list"><div>${display(x)}</div><button class="secondary" onclick="go('${k==='parts'?'part':k.slice(0,-1)}-edit','${x.id}')">Edit</button></div>`).join('')||'<p class="muted">No records yet.</p>'}</div>`}
const makes=['Audi','Acura','Alfa Romeo','BMW','Buick','Cadillac','Chevrolet','Chrysler','Dodge','Fiat','Ford','Genesis','GMC','Honda','Hyundai','Infiniti','Jaguar','Jeep','Kia','Land Rover','Lexus','Lincoln','Mazda','Mercedes-Benz','Mini','Mitsubishi','Nissan','Porsche','Ram','Subaru','Tesla','Toyota','Volkswagen','Volvo','Other'];
function editor(k){let item=(records[k]||[]).find(x=>x.id===edit)||{};let fields='';if(k==='customers')fields=`${formField('Customer name','name',item.name,'text','required')}${formField('Phone','phone',item.phone,'tel')}${formField('Email','email',item.email,'email')}${formField('Address','address',item.address)}${formField('Preferred labor rate ($/hour)','preferred_labor_rate',item.preferred_labor_rate,'number','min="0" step="0.01"')}${formField('Notes','notes',item.notes)}`;
if(k==='vehicles')fields=`${selectField('Customer','customer_id',options('customers'),item.customer_id,'required')}${formField('VIN (17 characters)','vin',item.vin,'text','maxlength="17"')}${formField('Tag / license plate','plate',item.plate)}${selectField('Year','year',Array.from({length:80},(_,i)=>String(2027-i)),item.year||2026)}${selectField('Make','make',makes,item.make||'Audi')}${formField('Model','model',item.model,'text','required')}${formField('Trim / engine','trim',item.trim)}${formField('Mileage','mileage',item.mileage,'number','min="0"')}`;
if(k==='parts')fields=`${formField('Part description','description',item.description,'text','required')}${formField('SKU / part number','sku',item.sku)}${formField('Supplier','supplier',item.supplier)}${formField('Cost','cost',item.cost||0,'number','min="0" step="0.01"')}${formField('Selling price','sale_price',item.sale_price||0,'number','min="0" step="0.01"')}${formField('Quantity in stock','quantity_on_hand',item.quantity_on_hand||0,'number','step="0.01"')}`;
if(k==='jobs')fields=`${selectField('Customer','customer_id',options('customers'),item.customer_id,'required')}${selectField('Vehicle','vehicle_id',options('vehicles','None'),item.vehicle_id)}${selectField('Status','status',['estimate','approved','in_progress','completed','cancelled'],item.status||'estimate')}${formField('Customer complaint','complaint',item.complaint)}${formField('Diagnosis','diagnosis',item.diagnosis)}${formField('Work performed','work_performed',item.work_performed)}`;
if(k==='invoices')fields=`${selectField('Customer','customer_id',options('customers'),item.customer_id,'required')}${selectField('Vehicle','vehicle_id',options('vehicles','None'),item.vehicle_id)}${selectField('Work order','job_id',options('jobs','None'),item.job_id)}${selectField('Status','status',['draft','sent','partially_paid','paid','void'],item.status||'draft')}${formField('Hourly labor rate','labor_rate',item.labor_rate??settings.labor_rate,'number','min="0" step="0.01"')}${formField('Mobile service fee','service_fee',item.service_fee??settings.service_fee,'number','min="0" step="0.01"')}${formField('Tax rate (%)','tax_percent',n(item.tax_rate??settings.default_tax_rate)*100,'number','min="0" max="100" step="0.01"')}${formField('Notes','notes',item.notes)}`;
return `<div class="panel"><h2>${edit?'Edit':'New'} ${k.slice(0,-1)}</h2><form onsubmit="saveRecord(event,'${k}')"><div class="grid">${fields}</div><div class="actions"><button>Save</button><button type="button" class="secondary" onclick="go('${k}')">Cancel</button></div></form>${k==='vehicles'?'<p class="muted">VIN decoder available after saving, using the public NHTSA service.</p>':''}</div>`}
async function saveRecord(ev,k){ev.preventDefault();let f=new FormData(ev.target),obj=Object.fromEntries(f.entries());for(let key of Object.keys(obj))if(obj[key]==='')obj[key]=null;if(k==='vehicles'){if(obj.vin){obj.vin=obj.vin.toUpperCase();if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(obj.vin))return toast('VIN must have 17 valid characters')}obj.year=n(obj.year);obj.mileage=obj.mileage===null?null:n(obj.mileage)}if(k==='invoices'){obj.tax_rate=n(obj.tax_percent)/100;delete obj.tax_percent}for(let key of ['labor_rate','service_fee','preferred_labor_rate','cost','sale_price','quantity_on_hand'])if(key in obj&&obj[key]!==null)obj[key]=n(obj[key]);try{if(edit)await update(k,edit,obj);else await insert(k,obj);await load();go(k)}catch(e){msg(e)}}
function invoiceView(){let i=records.invoices.find(x=>x.id===edit);if(!i)return '<div class="panel">Invoice not found</div>';let lines=records.items.filter(x=>x.invoice_id===i.id),t=invoiceTotal(i),paid=invoicePaid(i.id);return `<div class="panel"><div class="actions no-print"><button onclick="window.print()">Print / Save PDF</button><button onclick="go('invoices')" class="secondary">Back</button></div><div class="printable"><h2>${esc(settings.business_name)}</h2><p>${esc(settings.business_address||'Mobile mechanic service')}</p><h2>Invoice #${i.invoice_number}</h2><p><b>Customer:</b> ${esc(cName(i.customer_id))}<br><b>Vehicle:</b> ${esc(vName(i.vehicle_id))}<br><b>Status:</b> ${esc(i.status)}<br><b>Labor rate:</b> ${money(i.labor_rate)}/hour</p><div class="scroll"><table><tr><th>Type</th><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${lines.map(x=>`<tr><td>${esc(x.item_type)}</td><td>${esc(x.description)}</td><td>${x.quantity}</td><td>${money(x.unit_price)}</td><td>${money(n(x.quantity)*n(x.unit_price))}</td></tr>`).join('')}</table></div><p class="right">Items subtotal: ${money(t.sub)}<br>Tax: ${money(t.tax)}<br>Mobile service fee: ${money(i.service_fee)}<br><b>Total: ${money(t.total)}</b><br>Paid: ${money(paid)}<br><b>Balance: ${money(Math.max(0,t.total-paid))}</b></p><p>${esc(i.notes)}</p></div><div class="no-print"><h2>Invoice line items</h2><form onsubmit="addLine(event)"><div class="grid three">${selectField('Type','item_type',['part','labor','fee','discount'])}${formField('Description','description','','text','required')}${formField('Quantity / hours','quantity',1,'number','step="0.01" min="0.01" required')}${formField('Unit price / hourly rate','unit_price',i.labor_rate,'number','step="0.01" required')}${selectField('Taxable?','taxable',[['false','No'],['true','Yes']])}</div><button>Add line</button></form>${lines.map(x=>`<div class="list"><div>${esc(x.description)} · ${money(n(x.quantity)*n(x.unit_price))}</div><button class="secondary" onclick="deleteLine('${x.id}')">Remove</button></div>`).join('')}<hr><h2>Record payment</h2><form onsubmit="addPayment(event)"><div class="grid">${selectField('Method','method',[['cash','Cash'],['zelle','Zelle'],['cash_app','Cash App']])}${formField('Amount','amount',Math.max(0,t.total-paid).toFixed(2),'number','min="0.01" step="0.01" required')}${formField('Transaction reference (optional)','reference')}</div><button>Record payment</button></form>${records.payments.filter(x=>x.invoice_id===i.id).map(p=>`<div class="list">${esc(p.method)} · ${money(p.amount)} · ${esc(p.reference)}</div>`).join('')}</div></div>`}
async function addLine(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.invoice_id=edit;x.quantity=n(x.quantity);x.unit_price=n(x.unit_price);x.taxable=x.taxable==='true';if(x.item_type==='discount')x.unit_price=-Math.abs(x.unit_price);try{await insert('items',x);await load();render()}catch(err){msg(err)}}
async function deleteLine(id){if(!confirm('Remove this line?'))return;try{await remove('items',id);await load()}catch(e){msg(e)}}
async function addPayment(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.invoice_id=edit;x.amount=n(x.amount);try{await insert('payments',x);await load();let i=records.invoices.find(i=>i.id===edit);let due=invoiceTotal(i).total-invoicePaid(i.id);await update('invoices',edit,{status:due<=.009?'paid':'partially_paid'});await load()}catch(err){msg(err)}}
function reports(){let inv=records.invoices||[];return `<div class="panel"><h2>Financial overview</h2><p>Invoiced: <b>${money(inv.reduce((s,i)=>s+invoiceTotal(i).total,0))}</b></p><p>Payments recorded: <b>${money((records.payments||[]).reduce((s,p)=>s+n(p.amount),0))}</b></p><p>Outstanding: <b>${money(inv.reduce((s,i)=>s+Math.max(0,invoiceTotal(i).total-invoicePaid(i.id)),0))}</b></p><p class="muted">Payments are recorded manually; Zelle and Cash App transfers are not independently verified.</p></div>`}
function settingsPage(){return `<div class="panel"><h2>Business settings</h2><form onsubmit="saveBusiness(event)"><div class="grid">${formField('Business name','business_name',settings.business_name)}${formField('Business address','business_address',settings.business_address)}${formField('Default hourly labor rate','labor_rate',settings.labor_rate,'number','min="0" step="0.01"')}${formField('Mobile service fee','service_fee',settings.service_fee,'number','min="0" step="0.01"')}${formField('Initial tax rate (%)','tax_percent',n(settings.default_tax_rate)*100,'number','min="0" max="100" step="0.01"')}</div><button>Save settings</button></form><p class="notice">Tax is applied only to invoice lines marked taxable. Confirm applicable tax treatment with a qualified tax adviser.</p></div><div class="panel"><h2>Security</h2><p>Cloud access requires a Supabase owner session. Your PIN only unlocks a device that is already signed in.</p><button class="secondary" onclick="lockNow()">Lock now</button> <button class="secondary" onclick="resetPin()">Reset device PIN</button></div>`}
async function saveBusiness(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.default_tax_rate=n(x.tax_percent)/100;delete x.tax_percent;x.labor_rate=n(x.labor_rate);x.service_fee=n(x.service_fee);try{if(records.settings.length)await update('settings',records.settings[0].id,x);else await insert('settings',x);await load();toast('Settings saved')}catch(err){msg(err)}}
function render(){if(locked)return;document.querySelector('nav').classList.remove('hide');$('nav').innerHTML=nav();$('logout').style.display='';let content={dashboard,customers:()=>listing('customers','Customers',x=>`<b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone)}</span>`),vehicles:()=>listing('vehicles','Vehicles',x=>`<b>${esc(vName(x.id))}</b><br><span class="muted">VIN ${esc(x.vin)} · ${esc(cName(x.customer_id))}</span>`),parts:()=>listing('parts','Parts inventory',x=>`<b>${esc(x.description)}</b> · ${money(x.sale_price)}<br><span class="muted">${esc(x.sku)} · Stock ${x.quantity_on_hand}</span>`),jobs:()=>listing('jobs','Work orders',x=>`<b>${esc(cName(x.customer_id))}</b> · ${esc(x.status)}<br>${esc(x.complaint)}`),invoices:()=>listing('invoices','Invoices',x=>`<b>#${x.invoice_number}</b> · ${esc(cName(x.customer_id))} · ${money(invoiceTotal(x).total)} <button onclick="go('invoice-view','${x.id}')">View</button>`),reports,settings:settingsPage,'customer-edit':()=>editor('customers'),'vehicle-edit':()=>editor('vehicles'),'part-edit':()=>editor('parts'),'job-edit':()=>editor('jobs'),'invoice-edit':()=>editor('invoices'),'invoice-view':invoiceView};$('app').innerHTML=(content[screen]||dashboard)()}
function showLogin(){document.querySelector('nav').classList.add('hide');$('logout').style.display='none';$('app').innerHTML=`<div class="panel lock"><h2>FMG Owner Sign In</h2><p class="muted">Sign in once on each trusted device. Then unlock using your device PIN.</p><form onsubmit="login(event)">${formField('Supabase account email','email','','email','required autocomplete="username"')}${formField('Password','password','','password','required autocomplete="current-password"')}<button>Secure sign in</button></form></div>`}
const pinKey='fmg_pin_verifier_v3';let pinInput='',pinStage='unlock',firstPin='';
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
async function derive(pin,salt){let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:250000,hash:'SHA-256'},key,256))}
async function initLock(){pinStage=localStorage.getItem(pinKey)?'unlock':'new';pinInput='';showLock()}
function showLock(){document.querySelector('nav').classList.add('hide');$('logout').style.display='';let title={unlock:'Enter your 4-digit PIN',new:'Create your 4-digit PIN',confirm:'Confirm your PIN'}[pinStage];$('app').innerHTML=`<div class="panel lock"><h2>${title}</h2><p class="muted">The PIN is configured separately on each device. You may choose the same PIN, but never share it in chat.</p><div class="dots">${'●'.repeat(pinInput.length)}${'○'.repeat(4-pinInput.length)}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(d=>d?`<button onclick="pinTap('${d}')">${d}</button>`:'<span></span>').join('')}</div><p class="muted">PIN is a convenience lock, not a replacement for secure Supabase sign-in.</p><button class="secondary" onclick="signOut()">Sign out / account recovery</button></div>`}
async function pinTap(d){if(d==='⌫'){pinInput=pinInput.slice(0,-1);showLock();return}if(pinInput.length>=4)return;pinInput+=d;showLock();if(pinInput.length!==4)return;let pin=pinInput;pinInput='';if(pinStage==='new'){firstPin=pin;pinStage='confirm';showLock();return}if(pinStage==='confirm'){if(pin!==firstPin){pinStage='new';firstPin='';toast('PINs did not match');showLock();return}let salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem(pinKey,JSON.stringify({salt,hash:await derive(pin,salt)}));firstPin='';locked=false;await load();return}let obj=JSON.parse(localStorage.getItem(pinKey));let failures=JSON.parse(localStorage.getItem('fmg_pin_failures')||'{"count":0,"until":0}');if(Date.now()<failures.until){toast('Too many attempts. Sign out and sign in securely to recover.');showLock();return}if(await derive(pin,obj.salt)===obj.hash){localStorage.removeItem('fmg_pin_failures');locked=false;await load()}else{failures.count++;if(failures.count>=5){failures.until=Date.now()+15*60*1000;failures.count=0}localStorage.setItem('fmg_pin_failures',JSON.stringify(failures));toast('Incorrect PIN');showLock()}}
function lockNow(){locked=true;initLock()}
function resetPin(){if(!confirm('Reset this device PIN? You will need to create a new one.'))return;localStorage.removeItem(pinKey);lockNow()}
async function signOut(){session=null;locked=true;records={};sessionStorage.removeItem('fmg_session');showLogin()}
let idle;function activity(){if(!locked&&session){clearTimeout(idle);idle=setTimeout(lockNow,5*60*1000)}}['pointerdown','keydown'].forEach(x=>document.addEventListener(x,activity));document.addEventListener('visibilitychange',()=>{if(document.hidden&&session&&!locked)lockNow()});
(async()=>{try{session=JSON.parse(sessionStorage.getItem('fmg_session')||'null')}catch{}if(session){if(session.expires_at&&session.expires_at*1000<Date.now()&&!(await refresh()))session=null;if(session)await initLock();else showLogin()}else showLogin()})();
</script></body></html>
