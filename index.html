.repair-category{background:rgba(255,255,255,.85);padding:12px;border-radius:10px;border:1px solid #c9dbe8}
.repair-category label{margin:0 0 6px}
.repair-category input,.repair-category select{margin:0 0 10px}

/* Racing design option 2: crisp navy panels and high-contrast controls */
header{background:linear-gradient(110deg,#071b32,#112c49 75%,#1a3c5b)}
nav button.active,button:not(.secondary){background:#07588e}
.panel{background-color:rgba(255,255,255,.94)}
button[onclick^="deleteInvoiceFromList"]{background:#d7192e!important;color:white!important}
@media print{button[onclick^="deleteInvoiceFromList"]{display:none!important}}

/* Racing Design 2 visibility correction: render the watermark ABOVE panel backgrounds. */
body{background:linear-gradient(135deg,#eaf1fa 0%,#e5edf6 60%,#f4f8fc 100%)}
header{background:linear-gradient(110deg,#071b32 0%,#102c4b 75%,#173a58 100%);border-bottom:3px solid #126d8e}
.panel,.printable{position:relative;isolation:isolate;overflow:hidden;background:#fff}
.panel::before,.printable::before{z-index:0!important;opacity:.80!important;background-position:center center;background-size:min(94%,1000px) auto}
.panel > *,.printable > *{position:relative;z-index:1}
.panel h2{color:#092a48}
@media print{
 .panel::before,.printable::before{z-index:0!important;opacity:.68!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .panel,.printable{background:#fff!important}
 .printable > *{position:relative;z-index:1}
}

/* FMG Racing Design 2 — polished application layout, no database changes */
:root{font-size:15px;color:#102d46;background:#e6edf7}
body{min-height:100vh;background:linear-gradient(145deg,#e7effa,#dce8f5 55%,#eef3f9)}
header{min-height:120px;padding:22px max(22px,calc((100vw - 1380px)/2));background:linear-gradient(105deg,#071b31 0%,#102b4b 70%,#071b31 100%)!important;border-bottom:4px solid #0d6c9f;box-shadow:0 6px 18px #001a3430;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:11%;top:-70px;width:350px;height:260px;opacity:.12;transform:rotate(-17deg);background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/58px 58px;pointer-events:none}
header>div{position:relative;z-index:1}header b{font-size:clamp(20px,2.5vw,31px);font-weight:850;letter-spacing:.2px}header small{font-size:13px;line-height:1.5;color:#d6eaf8}header small:first-of-type{color:#4fb1e2;font-weight:800;letter-spacing:.6px}header button{position:relative;z-index:2}
main{max-width:1440px;padding:18px 22px 50px}
nav{gap:9px;margin-bottom:17px;flex-wrap:wrap}nav button{padding:13px 20px;background:#d6e5f4!important;color:#173e60!important;border:1px solid #b9d0e4;font-weight:750;box-shadow:0 2px 5px #1d45620c}nav button.active{background:linear-gradient(120deg,#075184,#0d7aaf)!important;color:#fff!important;box-shadow:0 4px 12px #0a5b9136}
.panel{background:rgba(255,255,255,.92)!important;border:1px solid #c6d7e7;border-radius:17px;box-shadow:0 7px 20px #0d335323;padding:23px;margin-bottom:17px;min-height:100px}
.panel::before{background-position:center center!important;background-size:cover!important;opacity:.52!important;pointer-events:none}
.panel h2{font-size:clamp(22px,2.5vw,30px);font-weight:850;letter-spacing:-.4px;color:#092944;margin-bottom:18px}
.panel h2:before{content:"▥";color:#09689f;margin-right:10px;font-size:.85em}
.panel .panel h2:before{content:none}
button{background:linear-gradient(135deg,#075184,#096ca0);border-radius:10px;padding:12px 17px;box-shadow:0 2px 6px #092d481c;transition:filter .15s}button:hover{filter:brightness(1.08)}button.secondary{background:#dceaf6;color:#163d5e;border:1px solid #b8d0e3}
.actions{gap:11px;margin:16px 0}.actions button{min-height:44px}
.stat{background:rgba(231,242,252,.95);border:1px solid #c8ddec;border-radius:12px;padding:19px}.stat b{font-size:29px;color:#0c3453}
.list{background:rgba(255,255,255,.68);padding:15px 9px;border-bottom:1px solid #c8d7e4}.list:last-child{border-bottom:0}
.scroll{background:rgba(255,255,255,.87);border:1px solid #cbdce9;border-radius:10px}
table{background:rgba(255,255,255,.88)}th{background:#123c5e;color:white;font-weight:750}td{background:rgba(255,255,255,.88)}tr:nth-child(even) td{background:rgba(228,239,248,.88)}th,td{padding:11px 12px}
input,select,textarea{background:rgba(255,255,255,.96);border:1px solid #b7cadb}label{color:#183a54}
.printable{background:rgba(255,255,255,.94)!important;border:1px solid #aebfd1;border-radius:12px;padding:25px}.printable::before{opacity:.35!important;background-size:90% auto!important;background-position:center 58%!important}
.printable h2:first-child{font-size:26px;color:#082f4c}
button[onclick^="deleteInvoiceFromList"]{background:#cf1834!important;color:#fff!important}
@media(min-width:1000px){.panel:has(.stats){min-height:260px}.panel:has(.stats) .stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){header{padding:16px;min-height:100px}header b{font-size:19px}main{padding:10px}.panel{padding:14px}nav{flex-wrap:nowrap}nav button{padding:10px 13px}.panel::before{background-size:auto 75%!important}.printable{padding:12px}}
@media print{body{background:#fff!important}header,nav,.no-print{display:none!important}main{max-width:none;padding:0}.panel{border:0;box-shadow:none;padding:0;background:#fff!important}.panel::before{display:none}.printable{border:0;padding:12px}.printable::before{opacity:.17!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}th{background:#123c5e!important;color:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Revision 5: camera-assisted VIN entry */
.vin-capture{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.vin-capture label{display:inline-flex;align-items:center;gap:7px;background:#dceaf6;border:1px solid #b8d0e3;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:700;color:#163d5e}
.vin-capture input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.vin-capture small{color:#526b7e;flex-basis:100%}
/* Vehicle thumbnail in vehicle editor heading */
.vehicle-editor-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:116px;margin-bottom:12px}
.vehicle-editor-heading h2{margin:0}
.vehicle-photo{width:180px;height:112px;flex-shrink:0;position:relative;border-radius:12px;overflow:hidden;border:2px solid #a8c6dc;background:linear-gradient(145deg,#e4edf6,#b4cddd);box-shadow:0 3px 12px #153b582a}
.vehicle-photo img{width:100%;height:100%;object-fit:cover;display:none}
.vehicle-photo .vehicle-photo-fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9px;color:#194466}
.vehicle-photo .vehicle-photo-fallback svg{width:92px;height:48px}
.vehicle-photo .vehicle-photo-fallback span{font-size:11px;font-weight:750;line-height:1.25}
.vehicle-photo .vehicle-photo-credit{display:none;position:absolute;bottom:0;right:0;left:0;background:#071b31ba;color:white;text-align:center;font-size:9px;padding:3px}
@media(max-width:520px){.vehicle-photo{width:125px;height:83px}.vehicle-editor-heading{min-height:90px}.vehicle-photo .vehicle-photo-fallback svg{width:68px;height:34px}}
@media print{.vehicle-photo{display:none}}

/* Revision 5 Racing Design 2 — reference-matched responsive dashboard */
header{min-height:125px!important;padding:18px 26px!important;background:#071b31!important;border-bottom:3px solid #0b6094!important}

.fmg-report-layout{display:grid;grid-template-columns:minmax(0,1.95fr) minmax(315px,1fr);gap:15px;align-items:start}
.fmg-report-left{min-width:0}
.fmg-report-layout .panel{padding:17px;margin-bottom:12px;background:rgba(255,255,255,.96)!important}
.fmg-report-layout .panel h2{font-size:23px;margin-bottom:14px}
.fmg-hero{min-height:235px;display:flex;flex-direction:column;justify-content:space-between}
.fmg-hero:before{opacity:.34!important;background-size:cover!important}
.fmg-hero .fmg-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fmg-quick button{min-height:68px;text-align:left;padding:12px 10px;font-size:13px;line-height:1.35;display:flex;gap:8px;align-items:center}
.fmg-quick button.secondary{background:#d9eefa!important;color:#075184!important}
.fmg-quick .quick-icon{font-size:23px;line-height:1}
.fmg-quick small{display:block;font-size:10px;font-weight:500;margin-top:3px}
.fmg-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fmg-toolbar h2{margin:0!important}
.fmg-toolbar-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fmg-toolbar-actions input,.fmg-toolbar-actions select{width:auto;max-width:170px;margin:0;padding:8px;font-size:12px}
.fmg-toolbar-actions button{padding:9px 11px;font-size:12px}
.fmg-report-layout .scroll{max-width:100%}
.fmg-report-layout table{font-size:12px}
.fmg-report-layout th,.fmg-report-layout td{padding:9px 8px}
.fmg-report-layout td{white-space:normal}
.fmg-status{display:inline-block;padding:4px 9px;border-radius:7px;font-size:11px;font-weight:800;color:white;background:#ca3443}
.fmg-status.paid{background:#07893c}.fmg-status.partial{background:#d18c12}.fmg-status.open{background:#eab84c;color:#222}
.fmg-preview{position:sticky;top:12px;padding:13px!important}
.fmg-paper{background:#fff;border:1px solid #a8b9cb;min-height:670px;padding:14px 12px;position:relative;overflow:hidden;box-shadow:0 4px 13px #092b4b24;color:#102c46;font-size:12px}

async function load(){if(locked||!session)return;try{let keys=Object.keys(F);let data=await Promise.all(keys.map(k=>api(F[k])));keys.forEach((k,i)=>records[k]=data[i]||[]);settings=records.settings[0]||settings;render()}catch(e){msg(e)}}
async function insert(table,obj){return api(F[table],'?select=*',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)})}
async function update(table,id,obj){return api(F[table],'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(obj)})}
async function remove(table,id){return api(F[table],'?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
// Revision 7.2: Delete only unsigned work orders/estimates without linked invoices.
// Related job charge rows use the database's ON DELETE CASCADE constraint.
async function deleteWorkOrder(id){
 const job=(records.jobs||[]).find(x=>x.id===id);
 if(!job)return toast('Work order or estimate not found. Refresh the page.');
 const label=job.status==='estimate'?'estimate':'work order';
 const linked=(records.invoices||[]).filter(i=>i.job_id===id);
 if(linked.length)return toast('Cannot delete: this record has '+linked.length+' linked invoice(s). Keep the invoice and work order for accounting history.');
 let approvals;
 try{
  approvals=await api('fmg_estimate_approvals','?select=id&job_id=eq.'+encodeURIComponent(id)+'&limit=1');
 }catch(e){
  return toast('Cannot verify signed approvals. Confirm Revision 7 approval SQL is installed before deleting.');
 }
 if(approvals.length)return toast('Cannot delete: a signed customer approval is attached. Preserve the authorization record.');
 const charges=(records.jobItems||[]).filter(x=>x.job_id===id).length;
 const detail=[cName(job.customer_id),vName(job.vehicle_id),job.complaint||repairCategories(job).join(', ')].filter(Boolean).join(' — ');
 if(!confirm('Permanently delete this '+label+'?\n\n'+detail+'\n\n'+charges+' work-order charge(s) will also be removed. This cannot be undone.'))return;
 try{
  // The FK constraints provide the final safeguard against linked invoices/approvals.
  await api(F.jobs,'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=representation'}}).then(rows=>{
   if(!Array.isArray(rows)||rows.length!==1)throw Error('Deletion was not confirmed. Please refresh and check the record.');
  });
  // Best-effort cleanup of private photos stored for this job.
  try{
   const photos=await listRecordPhotos('jobs',id);
   for(const p of photos){const path=photoPath('jobs',id)+p.name;await storageRequest('object/'+PHOTO_BUCKET+'/'+path,{method:'DELETE'});}
  }catch(e){console.warn('Job removed, but associated photo cleanup may require attention:',e)}
  toast('Deleted '+label+' successfully');
  await load();
 }catch(e){msg(e)}
}

// Vehicle image lookup is display-only: never changes stored vehicle data.
// Wikimedia Commons public API supplies a representative image when available.
let vehiclePhotoRequest=0, vehiclePhotoDelay;
function queueVehiclePhoto(){clearTimeout(vehiclePhotoDelay);vehiclePhotoDelay=setTimeout(updateVehiclePhoto,450)}
async function updateVehiclePhoto(){
 const form=document.querySelector('#app form'),holder=$('vehicle-photo');if(!form||!holder)return;
 const field=name=>String(form.elements.namedItem(name)?.value||'').trim();
 const year=field('year'),make=field('make'),model=field('custom_model')||field('model');
 const label=[year,make,model].filter(Boolean).join(' ');
 const img=$('vehicle-photo-img'),fallback=$('vehicle-photo-fallback'),caption=$('vehicle-photo-label'),credit=$('vehicle-photo-credit');
 caption.textContent=label||'Select a vehicle';holder.setAttribute('aria-label',label?'Representative photo of '+label:'Vehicle photo');
 img.style.display='none';img.removeAttribute('src');fallback.style.display='flex';credit.style.display='none';
 const token=++vehiclePhotoRequest;
 if(!make||!model||model==='Other'||model==='Select a model')return;
 try{
   const key='fmg_photo_'+year+'_'+make+'_'+model;
   let url=sessionStorage.getItem(key);
   if(!url){
     const params=new URLSearchParams({action:'query',generator:'search',gsrsearch:'filetype:bitmap '+year+' '+make+' '+model+' automobile',gsrnamespace:'6',gsrlimit:'8',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'450',format:'json',origin:'*'});
     const response=await fetch('https://commons.wikimedia.org/w/api.php?'+params.toString());if(!response.ok)throw Error('Image service unavailable');
     const data=await response.json();
     const pages=Object.values(data.query?.pages||{});
     const match=pages.find(p=>{const i=p.imageinfo?.[0];return i?.thumburl&&/^image\/(jpeg|png|webp)$/i.test(i.mime||'')&&String(p.title||'').toLowerCase().includes(make.toLowerCase())});
     url=match?.imageinfo?.[0]?.thumburl||'';
     if(url)try{sessionStorage.setItem(key,url)}catch{}
   }
   if(token!==vehiclePhotoRequest||!url)return;
   const test=new Image();test.onload=()=>{if(token!==vehiclePhotoRequest)return;img.src=url;img.alt='Representative '+label+' photo';img.style.display='block';fallback.style.display='none';credit.style.display='block'};test.src=url;
 }catch(e){/* Keep the vehicle silhouette if a representative image cannot be found. */}
}
document.addEventListener('change',e=>{if(e.target.closest('#app form')&&['year','make','model','custom_model'].includes(e.target.name))queueVehiclePhoto()});

let modelRequestId=0;
async function loadVehicleModels(){
 const form=document.querySelector('#app form');if(!form||!form.elements.namedItem('make')||!form.elements.namedItem('year'))return;
 const make=form.elements.namedItem('make').value,year=form.elements.namedItem('year').value,select=form.elements.namedItem('model'),status=$('model-result');
 const previous=select.value, requestId=++modelRequestId;
 select.innerHTML='<option value="">Loading models…</option>';status.textContent='Loading model list from NHTSA…';
 try{
 const key='fmg_models_'+make+'_'+year;let models=JSON.parse(sessionStorage.getItem(key)||'null');
 if(!models){const url='https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/'+encodeURIComponent(make)+'/modelyear/'+encodeURIComponent(year)+'?format=json';let res=await fetch(url);if(!res.ok)throw Error('NHTSA returned '+res.status);let data=await res.json();models=[...new Set((data.Results||[]).map(x=>String(x.Model_Name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));try{sessionStorage.setItem(key,JSON.stringify(models))}catch{}}
 if(requestId!==modelRequestId)return;
 select.innerHTML='<option value="">Select model</option>'+models.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'<option value="Other">Other / manual entry</option>';
 if(previous&&!models.includes(previous)){select.add(new Option(previous,previous))}select.value=previous||'';
 queueVehiclePhoto();status.textContent=models.length?models.length+' models available. Engine size can be verified using VIN or entered manually.':'No models returned; choose Other and enter a custom model.';

}

// Revision 5: camera VIN recognition. No image is uploaded to FMG or Supabase.
// On supported browsers, scan a VIN barcode locally; otherwise load Tesseract OCR
// on demand from a third-party CDN. OCR results always require human review.
let vinOcrScriptPromise=null;
function loadVinOcr(){
 if(window.Tesseract)return Promise.resolve();
 if(vinOcrScriptPromise)return vinOcrScriptPromise;
 vinOcrScriptPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  script.onload=resolve;script.onerror=()=>reject(Error('OCR library could not load. Check internet access.'));
  document.head.appendChild(script);
 });
 return vinOcrScriptPromise;
}
function vinCandidates(text){
 const clean=String(text||'').toUpperCase().replace(/[^A-Z0-9\n ]/g,' ');
 const lines=clean.split(/\n/).map(x=>x.replace(/\s/g,''));
 const sequences=[...lines,...clean.match(/[A-Z0-9]{17,}/g)||[]];
 const out=[];
 for(const sequence of sequences){
  for(let i=0;i<=sequence.length-17;i++){
   let v=sequence.slice(i,i+17);
   if(/^[A-HJ-NPR-Z0-9]{17}$/.test(v))out.push(v);
  }
 }
 return [...new Set(out)];
}
async function scanVinPhoto(event){
 const file=event.target.files?.[0],status=$('vin-scan-status');
 const form=document.querySelector('#app form'),vinInput=form?.elements.namedItem('vin');
 if(!file||!status||!vinInput)return;
 status.textContent='Reading VIN photo… Please wait.';
 try{
  let candidates=[];
  if('BarcodeDetector' in window){
   try{
    const formats=await BarcodeDetector.getSupportedFormats();
    const allowed=['code_39','code_128','pdf417','data_matrix'].filter(x=>formats.includes(x));
    if(allowed.length){
     const detector=new BarcodeDetector({formats:allowed});
     const codes=await detector.detect(await createImageBitmap(file));
     candidates=codes.flatMap(x=>vinCandidates(x.rawValue));
    }
   }catch(e){/* OCR fallback */}
  }
  if(!candidates.length){
   status.textContent='Recognizing VIN characters from photo…';
   await loadVinOcr();
   const result=await Tesseract.recognize(file,'eng',{logger:m=>{
    if(m.status==='recognizing text'&&status)status.textContent='Reading VIN photo… '+Math.round((m.progress||0)*100)+'%';
   }});
   candidates=vinCandidates(result.data?.text);
  }
  if(!candidates.length){status.textContent='Could not confidently read a 17-character VIN. Retake photo in bright light or enter it manually.';return}
  const candidate=candidates[0];
  vinInput.value=candidate;
  status.textContent=(candidates.length>1?'Multiple possible VINs found. ':'')+'Photo read: '+candidate+'. Confirm all 17 characters, then tap Verify VIN & Auto-Fill.';
  vinInput.focus();
 }catch(e){status.textContent='Photo scan unavailable: '+(e.message||e)+'. You can enter the VIN manually.'}
 finally{event.target.value=''}
}

 const vin=String(input?.value||'').trim().toUpperCase();if(input)input.value=vin;
 if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){el.textContent='VIN must contain 17 characters (excluding I, O, Q).';return}

 try{const response=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(vin)+'?format=json');
 if(!response.ok)throw Error('NHTSA service unavailable ('+response.status+')');
 const d=(await response.json()).Results?.[0];if(!d)throw Error('No vehicle data returned');

 vinResult={vin,issues:problems};queueVehiclePhoto();
 el.textContent=(problems.length?'NHTSA reported possible VIN issues ('+problems.join(',')+'). ':'NHTSA lookup completed. ')+(filled.length?'Auto-filled '+filled.join(', ')+'. ':'No fields available. ')+'Review before saving.';
 }catch(e){el.textContent='VIN lookup failed: '+e.message+'. You may enter details manually.'}
}

function reportTable(){let inv=(records.invoices||[]).filter(i=>i.status!=='void').sort((a,b)=>n(b.invoice_number)-n(a.invoice_number));if(reportDetailMode==='invoices')return `<div class="panel"><h2>All Invoices</h2><p class="muted">All non-void invoices. Amounts include applicable tax and mobile service fees.</p><div class="scroll"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Vehicle</th><th>Work performed / charges</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th><th class="no-print">Open</th></tr></thead><tbody>${inv.map(i=>{let total=invoiceTotal(i).total,paid=invoicePaid(i.id),balance=Math.max(0,total-paid),status=balance<=.009?'Paid':paid>0?'Partially Paid':'Unpaid';return `<tr><td>#${esc(i.invoice_number)}</td><td>${esc(cName(i.customer_id))}</td><td>${esc(vName(i.vehicle_id))}</td><td style="white-space:normal;min-width:220px">${esc(invoiceDescription(i))}</td><td>${money(total)}</td><td>${money(paid)}</td><td>${money(balance)}</td><td>${status}</td><td class="no-print"><button onclick="go('invoice-view','${i.id}')">View</button></td></tr>`}).join('')||'<tr><td colspan="9">No invoices found.</td></tr>'}</tbody></table></div><p><b>Total invoiced:</b> ${money(inv.reduce((a,i)=>a+invoiceTotal(i).total,0))} &nbsp; <b>Outstanding:</b> ${money(inv.reduce((a,i)=>a+Math.max(0,invoiceTotal(i).total-invoicePaid(i.id)),0))}</p></div>`;
let jobs=(records.jobs||[]).filter(j=>j.status==='estimate'||j.status==='approved').filter(j=>!(records.invoices||[]).some(i=>i.job_id===j.id&&i.status!=='void')).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));let amount=j=>(records.jobItems||[]).filter(x=>x.job_id===j.id).reduce((a,x)=>a+n(x.quantity)*n(x.unit_price)*(x.taxable?1+n(settings.default_tax_rate):1),0);return `<div class="panel"><h2>Open Estimates</h2><p class="muted">Estimate and approved work orders that do not have an active linked invoice. Amounts are calculated from recorded work-order charges; they exclude any mobile service fee not added as a charge.</p><div class="scroll"><table><thead><tr><th>Customer</th><th>Vehicle</th><th>Proposed work</th><th>Estimated amount</th><th>Status</th><th>Created</th><th class="no-print">Open</th></tr></thead><tbody>${jobs.map(j=>`<tr><td>${esc(cName(j.customer_id))}</td><td>${esc(vName(j.vehicle_id))}</td><td style="white-space:normal;min-width:220px">${esc(jobDescription(j))}</td><td>${money(amount(j))}</td><td>${esc(j.status)}</td><td>${esc(String(j.created_at||'').slice(0,10))}</td><td class="no-print"><button onclick="go('job-edit','${j.id}')">View</button></td></tr>`).join('')||'<tr><td colspan="7">No open estimates found.</td></tr>'}</tbody></table></div><p><b>Total open estimated charges:</b> ${money(jobs.reduce((a,j)=>a+amount(j),0))}</p></div>`}
function exportDetailCSV(){let mode=reportDetailMode,rows;if(mode==='invoices'){rows=[['Invoice','Customer','Vehicle','Work performed / charges','Amount','Paid','Balance','Status'],...(records.invoices||[]).filter(i=>i.status!=='void').map(i=>{let total=invoiceTotal(i).total,paid=invoicePaid(i.id),balance=Math.max(0,total-paid);return [i.invoice_number,cName(i.customer_id),vName(i.vehicle_id),invoiceDescription(i),total,paid,balance,balance<=.009?'Paid':paid>0?'Partially Paid':'Unpaid']})]}else{let jobs=(records.jobs||[]).filter(j=>['estimate','approved'].includes(j.status)&&!(records.invoices||[]).some(i=>i.job_id===j.id&&i.status!=='void'));rows=[['Customer','Vehicle','Proposed work','Estimated charges','Status','Created'],...jobs.map(j=>[cName(j.customer_id),vName(j.vehicle_id),jobDescription(j),(records.jobItems||[]).filter(x=>x.job_id===j.id).reduce((a,x)=>a+n(x.quantity)*n(x.unit_price)*(x.taxable?1+n(settings.default_tax_rate):1),0),j.status,String(j.created_at||'').slice(0,10)])]};let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='FMG_'+mode+'_report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function reports(){let r=reportData();let opts=reportOptions();return `<div class="panel"><h2>Financial Reports & Sales Tax</h2><div class="actions no-print"><button onclick="reportDetails('invoices')">View All Invoices</button><button onclick="reportDetails('estimates')">Open Estimates</button><button class="secondary" onclick="reportDetails('summary')">Financial Summary</button></div><div class="grid three">${selectField('Report period','report_period',[['monthly','Monthly'],['quarterly','Quarterly'],['annual','Annual']],reportPeriod,'onchange="changeReportPeriod(this.value)"')}${selectField('Year','report_year',Array.from({length:11},(_,i)=>String(new Date().getFullYear()+1-i)),reportYear,'onchange="changeReportYear(this.value)"')}${selectField('Period','report_bucket',opts,reportBucket,'onchange="changeReportBucket(this.value)"')}</div><div class="stats"><div class="stat">Invoiced including tax<b>${money(r.billedGross)}</b></div><div class="stat">Payments received<b>${money(r.received)}</b></div><div class="stat">Sales tax on invoices<b>${money(r.invoiceTax)}</b></div><div class="stat">Estimated tax in receipts<b>${money(r.taxReceived)}</b></div><div class="stat">Receipts excluding tax<b>${money(r.netReceived)}</b></div><div class="stat">Unpaid balance on period invoices<b>${money(r.outstanding)}</b></div></div><p class="muted">${r.billedCount} invoices issued; ${r.paymentCount} active payment entries received in the selected period.</p><div class="actions no-print"><button onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="shareInvoice('email')">Email</button><button class="secondary" onclick="shareInvoice('sms')">Text</button><button class="secondary" onclick="shareInvoice('native')">Share</button><button class="secondary" onclick="exportReportCSV()">Export CSV</button></div><p class="notice">Sales tax on invoices is calculated from taxable invoice lines. Estimated tax in receipts allocates each payment proportionally across the invoice total, including tax; it is not an official tax liability calculation. Payments are grouped by payment date, invoices by creation date. Outstanding balance is for invoices created during the period, as of today. No sales-tax remittance tracking is available yet. Verify tax jurisdiction, taxability, returns, refunds and actual remittances with your accountant. This is an operational report, not a tax return.</p></div>${reportDetailMode!=='summary'?`<div class="actions no-print"><button onclick="window.print()">Print report</button><button class="secondary" onclick="exportDetailCSV()">Export detailed CSV</button></div>${reportTable()}`:''}`}
function exportReportCSV(){let r=reportData();let rows=[['FMG Financial Report',reportPeriod,reportYear,reportBucket],['Metric','USD'],['Invoiced including tax',r.billedGross],['Payments received',r.received],['Sales tax on invoices',r.invoiceTax],['Estimated tax in receipts',r.taxReceived],['Receipts excluding tax',r.netReceived],['Unpaid balance on period invoices',r.outstanding],['Invoices',r.billedCount],['Payments',r.paymentCount]];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`FMG_report_${reportYear}_${reportPeriod}_${reportBucket}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settingsPage(){return `<div class="panel"><h2>Business settings</h2><form onsubmit="saveBusiness(event)"><div class="grid">${formField('Business name','business_name',settings.business_name)}${formField('Business address','business_address',settings.business_address)}${formField('Default hourly labor rate','labor_rate',settings.labor_rate,'number','min="0" step="0.01"')}${formField('Mobile service fee','service_fee',settings.service_fee,'number','min="0" step="0.01"')}${formField('Initial tax rate (%)','tax_percent',n(settings.default_tax_rate)*100,'number','min="0" max="100" step="0.01"')}</div><button>Save settings</button></form><p class="notice">Tax is applied only to invoice lines marked taxable. Confirm applicable tax treatment with a qualified tax adviser.</p></div><div class="panel"><h2>Security</h2><p>Cloud access requires a Supabase owner session. Your PIN only unlocks a device that is already signed in.</p><button class="secondary" onclick="lockNow()">Lock now</button> <button class="secondary" onclick="resetPin()">Reset device PIN</button></div>`}
async function saveBusiness(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.default_tax_rate=n(x.tax_percent)/100;delete x.tax_percent;x.labor_rate=n(x.labor_rate);x.service_fee=n(x.service_fee);try{if(records.settings.length)await update('settings',records.settings[0].id,x);else await insert('settings',x);await load();toast('Settings saved')}catch(err){msg(err)}}

// Reference-style dashboard: all figures derive from live records, never demo entries.
let fmgSearch='',fmgInvoiceStatus='all',fmgEstimateSearch='',fmgEstimateStatus='all',fmgSelectedInvoice=null;
function fmgSetSearch(value,kind){if(kind==='invoice')fmgSearch=value;else fmgEstimateSearch=value;fmgUpdateTables()}
function fmgSetStatus(value,kind){if(kind==='invoice')fmgInvoiceStatus=value;else fmgEstimateStatus=value;fmgUpdateTables()}
function fmgUpdateTables(){const a=document.getElementById('fmg-invoice-rows'),b=document.getElementById('fmg-estimate-rows');if(a)a.innerHTML=fmgInvoiceRows();if(b)b.innerHTML=fmgEstimateRows()}
function fmgStatus(i){const t=invoiceTotal(i).total,p=invoicePaid(i.id);return t-p<=.009?'Paid':p>0?'Partial':'Unpaid'}
function fmgInvoiceRows(){let invoices=(records.invoices||[]).filter(i=>i.status!=='void').sort((a,b)=>Number(b.invoice_number||0)-Number(a.invoice_number||0));invoices=invoices.filter(i=>{let st=fmgStatus(i);return (fmgInvoiceStatus==='all'||st===fmgInvoiceStatus)&&[i.invoice_number,cName(i.customer_id),vName(i.vehicle_id),invoiceDescription(i)].join(' ').toLowerCase().includes(fmgSearch.toLowerCase())});return invoices.map(i=>{let t=invoiceTotal(i).total,p=invoicePaid(i.id),st=fmgStatus(i);return `<tr><td><button class="secondary" style="padding:4px 7px" onclick="fmgChooseInvoice('${i.id}')">#${esc(i.invoice_number)}</button></td><td>${esc(cName(i.customer_id))}</td><td>${esc(vName(i.vehicle_id))}</td><td>${esc(invoiceDescription(i))}</td><td>${money(t)}</td><td>${money(p)}</td><td>${money(Math.max(0,t-p))}</td><td><span class="fmg-status ${st==='Paid'?'paid':st==='Partial'?'partial':''}">${st}</span></td></tr>`}).join('')||'<tr><td colspan="8" class="fmg-empty">No matching invoices.</td></tr>'}
function fmgOpenJobs(){return (records.jobs||[]).filter(j=>['estimate','approved'].includes(j.status)&&!(records.invoices||[]).some(i=>i.job_id===j.id&&i.status!=='void'))}
function fmgEstimateAmount(j){return (records.jobItems||[]).filter(x=>x.job_id===j.id).reduce((a,x)=>a+n(x.quantity)*n(x.unit_price)*(x.taxable?1+n(settings.default_tax_rate):1),0)}
function fmgEstimateRows(){let jobs=fmgOpenJobs().filter(j=>(fmgEstimateStatus==='all'||j.status===fmgEstimateStatus)&&[cName(j.customer_id),vName(j.vehicle_id),jobDescription(j)].join(' ').toLowerCase().includes(fmgEstimateSearch.toLowerCase()));return jobs.map(j=>`<tr><td><button class="secondary" style="padding:4px 7px" onclick="go('job-edit','${j.id}')">${esc(String(j.id).slice(0,8))}</button></td><td>${esc(cName(j.customer_id))}</td><td>${esc(vName(j.vehicle_id))}</td><td>${esc(jobDescription(j))}</td><td>${money(fmgEstimateAmount(j))}</td><td><span class="fmg-status open">${esc(j.status)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="fmg-empty">No open estimates.</td></tr>'}
function fmgChooseInvoice(id){fmgSelectedInvoice=id;let el=document.getElementById('fmg-invoice-preview');if(el)el.innerHTML=fmgInvoicePreview()}
function fmgInvoicePreview(){let i=(records.invoices||[]).find(x=>x.id===fmgSelectedInvoice&&x.status!=='void')||(records.invoices||[]).filter(x=>x.status!=='void').slice(-1)[0];if(!i)return `<div class="fmg-paper"><div class="fmg-paper-header"><div class="fmg-paper-brand">🔧 FMG MOBILE MECHANIC</div></div><h3>INVOICE</h3><p class="fmg-empty">Select an invoice to preview it here.</p></div>`;let t=invoiceTotal(i),p=invoicePaid(i.id),lines=(records.items||[]).filter(x=>x.invoice_id===i.id);let vehicle=(records.vehicles||[]).find(v=>v.id===i.vehicle_id);return `<div class="fmg-paper"><div class="fmg-paper-header"><div><div class="fmg-paper-brand">🔧 FMG MOBILE MECHANIC</div><div>ENTERPRISE · CLOUD EDITION</div><p><b>Fernando Melgarejo</b><br>(678) 465-8560<br>3214 Valley Bluff Drive<br>Atlanta, GA 30340</p></div><img src="${FMG_CAR}" alt="Honda Accord racing design"></div><h3>INVOICE #${esc(i.invoice_number)}</h3><div class="fmg-paper-meta"><div><b>Bill To</b><p>${esc(cName(i.customer_id))}</p></div><div><b>Vehicle</b><p>${esc(vName(i.vehicle_id))}<br>VIN: ${esc(vehicle?.vin||'Not entered')}</p></div></div><div class="scroll"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead><tbody>${lines.map(x=>`<tr><td>${esc(x.description)}</td><td>${esc(x.quantity)}</td><td>${money(x.unit_price)}</td><td>${money(n(x.quantity)*n(x.unit_price))}</td></tr>`).join('')||'<tr><td colspan="4">No line items</td></tr>'}</tbody></table></div><div class="fmg-totals"><div><span>Subtotal</span><b>${money(t.sub)}</b></div><div><span>Tax</span><b>${money(t.tax)}</b></div><div><span>Service fee</span><b>${money(i.service_fee)}</b></div><div><span>Total</span><b>${money(t.total)}</b></div><div><span>Paid</span><b>${money(p)}</b></div><div class="due"><span>Balance Due</span><b>${money(Math.max(0,t.total-p))}</b></div></div><p><b>Notes:</b> ${esc(i.notes||'')}</p><div class="fmg-paper-footer">FMG MOBILE MECHANIC · HONDA RACING DESIGN</div></div><div class="actions no-print"><button onclick="go('invoice-view','${i.id}')">Open Invoice</button><button class="secondary" onclick="window.print()">Print Preview</button></div>`}

// Photo attachments are stored in a private Supabase Storage bucket.
// Each saved job, vehicle, or inventory part may hold at most ten images.
const PHOTO_BUCKET='fmg-photos';
const photoLoaded=new Set();
function photoPanel(kind,id){
 if(!id)return '';
 return `<section class="photo-panel no-print" data-photo-kind="${esc(kind)}" data-photo-id="${esc(id)}"><h3>Vehicle / Parts Photos <span class="photo-count">(loading…)</span></h3><p class="muted">Add up to 10 photos for this ${kind==='jobs'?'work order':kind==='vehicles'?'vehicle':'part'}. Take photos with the camera or choose existing pictures. Photos are private and saved to your cloud account.</p><label class="photo-upload-label">📷 Add photos (up to 10)<input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple onchange="uploadRecordPhotos(event,'${kind}','${id}')"></label><div class="photo-status" role="status"></div><div class="photo-gallery"></div></section>`;
}
function photoPath(kind,id){return session.user.id+'/'+kind+'/'+id+'/'}
async function storageRequest(path,options={}){
 const headers={apikey:PUBLISHABLE_KEY,Authorization:'Bearer '+session.access_token,...options.headers};
 const response=await fetch(URL_BASE+'/storage/v1/'+path,{...options,headers});
 if(!response.ok){let detail=await response.text();try{let j=JSON.parse(detail);detail=j.message||j.error||detail}catch{}throw Error(detail||'Storage request failed')}
 return response;
}
async function listRecordPhotos(kind,id){
 const res=await storageRequest('object/list/'+PHOTO_BUCKET,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:photoPath(kind,id),limit:100,offset:0,sortBy:{column:'created_at',order:'asc'}})});
 const data=await res.json();return (Array.isArray(data)?data:[]).filter(f=>f.name&&!f.name.startsWith('.'));
}
async function signedPhotoUrl(path){
 const res=await storageRequest('object/sign/'+PHOTO_BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
 const data=await res.json();return new URL(data.signedURL||data.signedUrl,URL_BASE+'/storage/v1/').href;
}
async function refreshPhotoPanel(panel){
 if(!panel||!panel.isConnected)return;
 const kind=panel.dataset.photoKind,id=panel.dataset.photoId,status=panel.querySelector('.photo-status'),gallery=panel.querySelector('.photo-gallery');
 try{
  const files=await listRecordPhotos(kind,id);if(!panel.isConnected)return;
  panel.querySelector('.photo-count').textContent='('+files.length+'/10)';
  panel.querySelector('input[type=file]').disabled=files.length>=10;
  gallery.innerHTML='';
  for(const file of files){
   const path=photoPath(kind,id)+file.name;
   const card=document.createElement('div');card.className='photo-card';
   const a=document.createElement('a');a.target='_blank';a.rel='noopener noreferrer';
   const img=document.createElement('img');img.alt='Photo attached to '+kind;img.loading='lazy';a.append(img);card.append(a);
   const button=document.createElement('button');button.type='button';button.className='secondary';button.textContent='Remove photo';button.onclick=()=>deleteRecordPhoto(kind,id,path);card.append(button);gallery.append(card);
   try{const url=await signedPhotoUrl(path);a.href=url;img.src=url}catch{img.alt='Image preview unavailable'}
  }
  if(files.length===0)status.textContent='No photos uploaded yet.';else status.textContent='Tap a photo to view it full size.';
 }catch(e){if(panel.isConnected)status.textContent='Photo gallery unavailable: '+e.message+'. Run the Revision 6.4 Supabase SQL setup first.'}
}
function initPhotoPanels(){document.querySelectorAll('.photo-panel').forEach(panel=>{if(panel.dataset.loaded)return;panel.dataset.loaded='yes';refreshPhotoPanel(panel)})}
async function uploadRecordPhotos(event,kind,id){
 const input=event.target,panel=input.closest('.photo-panel'),status=panel.querySelector('.photo-status'),chosen=Array.from(input.files||[]);input.value='';if(!chosen.length)return;
 input.disabled=true;
 try{
  const current=await listRecordPhotos(kind,id);
  if(chosen.length>10-current.length)throw Error('Only '+(10-current.length)+' photo slot(s) available. Select fewer photos.');
  let uploaded=0;
  for(const file of chosen){
   if(file.size>8*1024*1024)throw Error(file.name+' exceeds the 8 MB limit.');
   // iPad HEIC is not reliably displayable in every browser; ask for JPEG/PNG/WebP.
   if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPEG, PNG or WebP photos. If your iPad uses HEIC, change Camera > Formats to Most Compatible or export as JPEG.');
   const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
   const path=photoPath(kind,id)+crypto.randomUUID()+'.'+ext;
   status.textContent='Uploading '+(uploaded+1)+' of '+chosen.length+'…';
   await storageRequest('object/'+PHOTO_BUCKET+'/'+path,{method:'POST',headers:{'Content-Type':file.type,'x-upsert':'false'},body:file});uploaded++;
  }
  toast(uploaded+' photo(s) saved');
 }catch(e){status.textContent='Upload stopped: '+e.message;toast('Photo upload needs attention')}finally{await refreshPhotoPanel(panel)}
}
async function deleteRecordPhoto(kind,id,path){
 if(!confirm('Permanently remove this photo?'))return;
 const panel=Array.from(document.querySelectorAll('.photo-panel')).find(x=>x.dataset.photoKind===kind&&x.dataset.photoId===id);
 try{await storageRequest('object/'+PHOTO_BUCKET+'/'+path,{method:'DELETE'});toast('Photo removed');if(panel)await refreshPhotoPanel(panel)}catch(e){toast('Could not remove photo: '+e.message)}
}

function fmgDate(value){if(!value)return 'Date not recorded';const d=new Date(value);return Number.isNaN(d.getTime())?String(value).slice(0,10):d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}
function vehicleHistory(){const v=(records.vehicles||[]).find(x=>x.id===edit);if(!v)return '<div class="panel">Vehicle not found</div>';
 const jobs=(records.jobs||[]).filter(j=>j.vehicle_id===v.id).sort((a,b)=>String(b.created_at||b.updated_at||'').localeCompare(String(a.created_at||a.updated_at||'')));
 const invoices=(records.invoices||[]).filter(i=>i.vehicle_id===v.id);
 return `<div class="panel"><h2>Service History — ${esc(vName(v.id))}</h2><p class="muted">VIN: ${esc(v.vin||'Not recorded')} · Mileage: ${esc(v.mileage??'Not recorded')} · Customer: ${esc(cName(v.customer_id))}</p><div class="actions no-print"><button class="secondary" onclick="go('vehicle-view','${v.id}')">Back to Vehicle</button><button onclick="window.print()">Print / Save PDF</button></div><h3>Work orders (${jobs.length})</h3>${jobs.map(j=>{const linked=invoices.filter(i=>i.job_id===j.id);const charges=(records.jobItems||[]).filter(x=>x.job_id===j.id);return `<div class="fmg-history-entry"><div><b>${esc(jobDescription(j))}</b><div class="muted">${esc(fmgDate(j.created_at||j.updated_at))} · ${esc(j.status)} · ${esc(j.complaint||'')}</div><div class="muted">${charges.length} charge line(s) · ${linked.length} linked invoice(s)</div></div><div class="actions no-print"><button class="secondary" onclick="go('job-view','${j.id}')">View job</button>${linked.map(i=>`<button class="secondary" onclick="go('invoice-view','${i.id}')">Invoice #${esc(i.invoice_number)}</button>`).join('')}</div></div>`}).join('')||'<p class="muted">No work orders for this vehicle yet.</p>'}<h3>Invoices (${invoices.length})</h3>${invoices.map(i=>`<div class="list"><div><b>Invoice #${esc(i.invoice_number)}</b> · ${esc(fmgDate(i.created_at))} · ${esc(i.status)}<br><span class="muted">${money(invoiceTotal(i).total)} · Paid ${money(invoicePaid(i.id))}</span></div><button class="secondary no-print" onclick="go('invoice-view','${i.id}')">View</button></div>`).join('')||'<p class="muted">No invoices yet.</p>'}</div>`;
}
function fmgInvoiceShareText(i){const total=invoiceTotal(i).total,paid=invoicePaid(i.id);return `FMG Mobile Mechanic — Fernando Melgarejo\nInvoice #${i.invoice_number}\nCustomer: ${cName(i.customer_id)}\nVehicle: ${vName(i.vehicle_id)}\nRepairs: ${invoiceRepairCategories(i).join('; ')||'See invoice'}\nTotal: ${money(total)}\nPaid: ${money(paid)}\nBalance: ${money(Math.max(0,total-paid))}\nPhone: (678) 465-8560\nFor a detailed PDF, please request a copy from Fernando Melgarejo.`.replace(/\\n/g,'\n')}
function shareInvoice(method){const i=(records.invoices||[]).find(x=>x.id===edit);if(!i)return toast('Open an invoice first');const text=fmgInvoiceShareText(i);const customer=(records.customers||[]).find(c=>c.id===i.customer_id)||{};
 if(method==='email'){const href='mailto:'+encodeURIComponent(customer.email||'')+'?subject='+encodeURIComponent('FMG Mobile Mechanic Invoice #'+i.invoice_number)+'&body='+encodeURIComponent(text);window.location.href=href;return}
 if(method==='sms'){const phone=String(customer.phone||'').replace(/[^+\d]/g,'');window.location.href='sms:'+phone+'?body='+encodeURIComponent(text);return}
 if(method==='native'){if(navigator.share){navigator.share({title:'FMG Invoice #'+i.invoice_number,text}).catch(()=>{});}else{navigator.clipboard?.writeText(text).then(()=>toast('Invoice summary copied; use Print / Save PDF for full invoice')).catch(()=>toast('Use Email or Text buttons to share'));}return}
}
function approvalHistoryScreen(){const j=(records.jobs||[]).find(x=>x.id===edit);if(!j)return '<div class="panel">Work order not found</div>';return `<div class="panel"><h2>Signed Estimate Approvals</h2><p class="muted">Signed records are read-only snapshots of what the customer approved.</p><button class="secondary no-print" onclick="go('job-view','${j.id}')">Back to work order</button><div id="fmg-approval-history">Loading signed approvals…</div></div>`}
async function loadApprovalHistory(){const el=$('fmg-approval-history');if(!el)return;try{const data=await api('fmg_estimate_approvals','?select=*&job_id=eq.'+encodeURIComponent(edit)+'&order=signed_at.desc');if(!el.isConnected)return;el.innerHTML=data.map(a=>{const snap=a.estimate_snapshot||{};return `<div class="printable" style="margin:14px 0"><h3>Approved by ${esc(a.customer_name)}</h3><p>Signed: ${esc(fmgDate(a.signed_at))} · In person<br>Vehicle: ${esc(snap.vehicle)}<br>Repair categories: ${esc((snap.repair_categories||[]).join('; '))}<br><b>Approved total: ${money(a.approved_total)}</b></p><div class="scroll"><table><tr><th>Description</th><th>Quantity</th><th>Rate</th></tr>${(snap.lines||[]).map(x=>`<tr><td>${esc(x.description)}</td><td>${n(x.quantity)}</td><td>${money(x.unit_price)}</td></tr>`).join('')}</table></div><p><b>Customer signature:</b></p><img src="${esc(a.signature_data)}" alt="Customer signature" style="width:100%;max-width:550px;background:white;border:1px solid #ccd"/></div>`}).join('')||'<p class="muted">No signed approvals yet.</p>';if(data.length)el.insertAdjacentHTML('afterbegin','<button class="no-print" onclick="window.print()">Print / Save Signed Approval PDF</button>')}catch(e){el.textContent='Unable to load approvals: '+e.message}}
function fmgEstimateSnapshot(job){const lines=(records.jobItems||[]).filter(x=>x.job_id===job.id).map(x=>({type:x.item_type,description:x.description,quantity:n(x.quantity),unit_price:n(x.unit_price),taxable:!!x.taxable}));const subtotal=lines.reduce((a,x)=>a+x.quantity*x.unit_price,0);const tax=lines.filter(x=>x.taxable).reduce((a,x)=>a+x.quantity*x.unit_price*n(settings.default_tax_rate),0);return {job_id:job.id,customer_id:job.customer_id,customer_name:cName(job.customer_id),vehicle_id:job.vehicle_id,vehicle:vName(job.vehicle_id),repair_categories:repairCategories(job),complaint:job.complaint||'',lines,subtotal,tax,total:subtotal+tax,estimated_at:new Date().toISOString()}}
let fmgSigning=false,fmgSigned=false,fmgCanvasContext=null;
function estimateApprovalScreen(){const j=(records.jobs||[]).find(x=>x.id===edit);if(!j)return '<div class="panel">Work order not found</div>';const snap=fmgEstimateSnapshot(j);return `<div class="panel"><h2>In-person Estimate Approval</h2><p class="muted">Customer reviews this estimate and signs on Fernando Melgarejo's phone or tablet. This is not a remote-signature link.</p><div class="printable"><h3>FMG Mobile Mechanic · Fernando Melgarejo</h3><p><b>Customer:</b> ${esc(snap.customer_name)}<br><b>Vehicle:</b> ${esc(snap.vehicle)}<br><b>Repair categories:</b> ${esc(snap.repair_categories.join('; ')||'N/A')}</p><div class="scroll"><table><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${snap.lines.map(x=>`<tr><td>${esc(x.description)}</td><td>${x.quantity}</td><td>${money(x.unit_price)}</td><td>${money(x.quantity*x.unit_price)}</td></tr>`).join('')}</table></div><p class="right">Subtotal: ${money(snap.subtotal)}<br>Estimated tax: ${money(snap.tax)}<br><b>Estimated total: ${money(snap.total)}</b></p></div><div class="no-print"><label>Customer full name<input id="fmg-signer-name" value="${esc(snap.customer_name)}" required></label><label class="fmg-consent"><input type="checkbox" id="fmg-consent"> I have reviewed the listed repairs and estimated charges, and authorize FMG Mobile Mechanic to perform the described work. Additional work or material price changes require my approval.</label><p><b>Customer signature</b> — sign below with a finger or stylus.</p><canvas id="fmg-signature" width="900" height="250" aria-label="Customer signature pad"></canvas><div class="actions"><button class="secondary" onclick="clearEstimateSignature()">Clear signature</button><button onclick="saveEstimateApproval('${j.id}')">Save signed approval</button><button class="secondary" onclick="go('job-view','${j.id}')">Back to work order</button></div><p class="muted">Saving requires the Revision 7 Supabase approval-table upgrade. Approval captures a snapshot of the selected repairs and charges.</p><div id="fmg-approval-status" role="status"></div></div></div>`}
function initSignaturePad(){const canvas=$('fmg-signature');if(!canvas)return;fmgSigned=false;fmgSigning=false;const ctx=canvas.getContext('2d');fmgCanvasContext=ctx;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#123c5e';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);fmgSigning=true;fmgSigned=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!fmgSigning)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});['pointerup','pointercancel','lostpointercapture'].forEach(t=>canvas.addEventListener(t,()=>fmgSigning=false))}
function clearEstimateSignature(){const canvas=$('fmg-signature');if(!canvas)return;fmgCanvasContext.clearRect(0,0,canvas.width,canvas.height);fmgCanvasContext.fillStyle='#fff';fmgCanvasContext.fillRect(0,0,canvas.width,canvas.height);fmgSigned=false}
async function saveEstimateApproval(jobId){const j=(records.jobs||[]).find(x=>x.id===jobId);if(!j)return toast('Work order not found');const signer=$('fmg-signer-name')?.value.trim();if(!signer)return toast('Enter customer full name');if(!$('fmg-consent')?.checked)return toast('Customer authorization checkbox is required');if(!fmgSigned)return toast('Customer signature is required');const snap=fmgEstimateSnapshot(j);if(!confirm(`Save customer approval of ${money(snap.total)}? This signed record cannot be edited.`))return;try{await api('fmg_estimate_approvals','?select=*',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({owner_id:session.user.id,job_id:jobId,customer_name:signer,signature_data:$('fmg-signature').toDataURL('image/png'),estimate_snapshot:snap,approved_total:snap.total,approval_method:'in_person'})});$('fmg-approval-status').textContent='Approval saved successfully. The signed estimate snapshot is retained.';toast('Signed estimate approval saved')}catch(e){msg(e);$('fmg-approval-status').textContent='Could not save approval. Confirm Revision 7 SQL was run: '+e.message}}

function render(){if(locked)return;document.querySelector('nav').classList.remove('hide');$('nav').innerHTML=nav();$('logout').style.display='';let content={dashboard,customers:()=>listing('customers','Customers',x=>`<b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone)}</span>`),vehicles:()=>listing('vehicles','Vehicles',x=>`<b>${esc(vName(x.id))}</b><br><span class="muted">VIN ${esc(x.vin)} · ${esc(cName(x.customer_id))}</span>`),parts:()=>listing('parts','Parts inventory',x=>`<b>${esc(x.description)}</b> · ${money(x.sale_price)}<br><span class="muted">${esc(x.sku)} · Stock ${x.quantity_on_hand}</span>`),jobs:()=>listing('jobs','Work orders',x=>`<b>${esc(cName(x.customer_id))}</b> · ${esc(x.status)}<br>${esc(x.complaint)}<br><span class="muted">${esc(repairCategories(x).join(', '))}</span>`),invoices:()=>listing('invoices','Invoices',x=>`<b>#${x.invoice_number}</b> · ${esc(cName(x.customer_id))} · ${money(invoiceTotal(x).total)} <button onclick="go('invoice-view','${x.id}')">View</button>`),reports,settings:settingsPage,'customer-view':()=>recordView('customers'),'vehicle-view':()=>recordView('vehicles'),'job-view':()=>recordView('jobs'),'part-view':()=>recordView('parts'),'customer-edit':()=>editor('customers'),'vehicle-edit':()=>editor('vehicles'),'part-edit':()=>editor('parts'),'job-edit':()=>editor('jobs'),'invoice-edit':()=>editor('invoices'),'invoice-view':invoiceView,'vehicle-history':vehicleHistory,'estimate-approval':estimateApprovalScreen,'approval-history':approvalHistoryScreen};$('app').innerHTML=(content[screen]||dashboard)();if(screen==='vehicle-edit'){loadVehicleModels();queueVehiclePhoto()}if(['parts','vehicles','jobs','invoice-view'].includes(screen))$('app').insertAdjacentHTML('beforeend',supplierLinks());initPhotoPanels();if(screen==='estimate-approval')initSignaturePad();if(screen==='approval-history')loadApprovalHistory()}
function showLogin(){document.querySelector('nav').classList.add('hide');$('logout').style.display='none';$('app').innerHTML=`<div class="panel lock"><h2>FMG Owner Sign In</h2><p class="muted">Sign in on this trusted device. Your session can stay signed in across browser restarts; use your PIN to unlock afterward.</p><form onsubmit="login(event)">${formField('Supabase account email','email','','email','required autocomplete="username"')}${formField('Password','password','','password','required autocomplete="current-password"')}<button>Secure sign in</button></form></div>`}
const pinKey='fmg_pin_verifier_v3';let pinInput='',pinStage='unlock',firstPin='';
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
async function derive(pin,salt){let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:250000,hash:'SHA-256'},key,256))}
async function initLock(){pinStage=localStorage.getItem(pinKey)?'unlock':'new';pinInput='';showLock()}
function showLock(){document.querySelector('nav').classList.add('hide');$('logout').style.display='';let title={unlock:'Enter your 4-digit PIN',new:'Create your 4-digit PIN',confirm:'Confirm your PIN'}[pinStage];$('app').innerHTML=`<div class="panel lock"><h2>${title}</h2><p class="muted">The PIN is configured separately on each device. You may choose the same PIN, but never share it in chat.</p><div class="dots">${'●'.repeat(pinInput.length)}${'○'.repeat(4-pinInput.length)}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(d=>d?`<button onclick="pinTap('${d}')">${d}</button>`:'<span></span>').join('')}</div><p class="muted">PIN is a convenience lock, not a replacement for secure Supabase sign-in.</p><button class="secondary" onclick="signOut()">Sign out / account recovery</button></div>`}
async function pinTap(d){if(d==='⌫'){pinInput=pinInput.slice(0,-1);showLock();return}if(pinInput.length>=4)return;pinInput+=d;showLock();if(pinInput.length!==4)return;let pin=pinInput;pinInput='';if(pinStage==='new'){firstPin=pin;pinStage='confirm';showLock();return}if(pinStage==='confirm'){if(pin!==firstPin){pinStage='new';firstPin='';toast('PINs did not match');showLock();return}let salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem(pinKey,JSON.stringify({salt,hash:await derive(pin,salt)}));firstPin='';locked=false;await load();return}let obj=JSON.parse(localStorage.getItem(pinKey));let failures=JSON.parse(localStorage.getItem('fmg_pin_failures')||'{"count":0,"until":0}');if(Date.now()<failures.until){toast('Too many attempts. Sign out and sign in securely to recover.');showLock();return}if(await derive(pin,obj.salt)===obj.hash){localStorage.removeItem('fmg_pin_failures');locked=false;await load()}else{failures.count++;if(failures.count>=5){failures.until=Date.now()+15*60*1000;failures.count=0}localStorage.setItem('fmg_pin_failures',JSON.stringify(failures));toast('Incorrect PIN');showLock()}}
function lockNow(){locked=true;initLock()}
function resetPin(){if(!confirm('Reset this device PIN? You will need to create a new one.'))return;localStorage.removeItem(pinKey);lockNow()}
async function signOut(){session=null;locked=true;records={};clearSession();showLogin()}
let idle;function activity(){if(!locked&&session){clearTimeout(idle);idle=setTimeout(lockNow,5*60*1000)}}['pointerdown','keydown'].forEach(x=>document.addEventListener(x,activity));document.addEventListener('visibilitychange',()=>{if(document.hidden&&session&&!locked)lockNow()});
(async()=>{try{session=JSON.parse(localStorage.getItem('fmg_trusted_session_v4')||sessionStorage.getItem('fmg_session')||'null')}catch{session=null}if(!session){showLogin();return}try{if(!session.refresh_token)throw Error('No refresh token');if(!session.expires_at||session.expires_at*1000<Date.now()+120000){if(!(await refresh()))throw Error('Session expired')}if(!(await ownerAuthorized()))throw Error('Account not authorized');persistSession();locked=true;await initLock()}catch(e){session=null;clearSession();showLogin();toast('Please sign in again to renew your trusted-device session.')}})();
</script></body></html>
