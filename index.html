</style></head><body><header><div>🔧 <b>FMG MOBILE MECHANIC</b><small>ENTERPRISE · CLOUD EDITION</small></div><button class="secondary" id="logout" onclick="signOut()" style="display:none">Sign out</button></header><main><nav id="nav" class="hide"></nav><div id="app"></div></main><div id="toast"></div><script>
'use strict';
const URL_BASE='https://qkcrknlzwnprafyfrdll.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_53wrE_RKFqkNrXk9IbX5Yw_LPSjtpaK';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);
const n=v=>Number(v)||0, uuid=()=>crypto.randomUUID(), today=()=>new Date().toISOString().slice(0,10);
const F={customers:'fmg_customers',vehicles:'fmg_vehicles',parts:'fmg_parts',jobs:'fmg_jobs',invoices:'fmg_invoices',items:'fmg_invoice_items',payments:'fmg_payments',jobItems:'fmg_job_items',settings:'fmg_settings'};
let session=null,locked=true,screen='dashboard',edit=null,records={};let vinResult=null;let settings={business_name:'FMG Mobile Mechanic',labor_rate:125,service_fee:75,default_tax_rate:.07};
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}
function msg(e){toast(e.message||String(e))}
function headers(){return {apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${session?.access_token||PUBLISHABLE_KEY}`,'Content-Type':'application/json'}}
async function req(path,opts={}){let res=await fetch(URL_BASE+path,{...opts,headers:{...headers(),...(opts.headers||{})}});let body=await res.text();let data;try{data=body?JSON.parse(body):null}catch{data=body}if(!res.ok)throw Error(data?.message||data?.error_description||data?.hint||res.statusText);return data}
function persistSession(){localStorage.setItem('fmg_trusted_session_v4',JSON.stringify(session))}
function clearSession(){localStorage.removeItem('fmg_trusted_session_v4');sessionStorage.removeItem('fmg_session')}
async function ownerAuthorized(){if(!session?.user?.id)return false;const who=await req('/rest/v1/fmg_owners?select=user_id&user_id=eq.'+encodeURIComponent(session.user.id));return Array.isArray(who)&&who.length>0}
async function login(ev){ev.preventDefault();let fd=new FormData(ev.target);try{let s=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:fd.get('email'),password:fd.get('password')})});session=s;let who=await req('/rest/v1/fmg_owners?select=user_id&user_id=eq.'+encodeURIComponent(s.user.id));if(!who.length)throw Error('This account is not authorized in fmg_owners');persistSession();locked=true;await initLock()}catch(e){session=null;clearSession();msg(e)}}
async function refresh(){if(!session?.refresh_token)return false;try{let s=await req('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});session=s;persistSession();return true}catch{return false}}
async function api(table,query='?select=*',opts={}){try{return await req('/rest/v1/'+table+query,opts)}catch(e){if(session&&/JWT expired|invalid JWT/i.test(e.message)&&await refresh())return req('/rest/v1/'+table+query,opts);throw e}}
async function load(){if(locked||!session)return;try{let keys=Object.keys(F);let data=await Promise.all(keys.map(k=>api(F[k])));keys.forEach((k,i)=>records[k]=data[i]||[]);settings=records.settings[0]||settings;render()}catch(e){msg(e)}}
async function insert(table,obj){return api(F[table],'?select=*',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)})}
async function update(table,id,obj){return api(F[table],'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(obj)})}
async function remove(table,id){return api(F[table],'?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
function formField(label,name,value='',type='text',extra=''){return `<label>${esc(label)}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function selectField(label,name,options,value='',extra=''){return `<label>${esc(label)}<select name="${name}" ${extra}>${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function nav(){return ['dashboard','customers','vehicles','jobs','parts','invoices','reports','settings'].map(x=>`<button class="${screen===x?'active':''}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function go(s,id=null){screen=s;edit=id;vinResult=null;render();scrollTo(0,0)}
function cName(id){return records.customers?.find(c=>c.id===id)?.name||'Unknown customer'}
function vName(id){let v=records.vehicles?.find(v=>v.id===id);return v?[v.year,v.make,v.model].filter(Boolean).join(' ')+' · '+(v.plate||'No tag'):'No vehicle'}
function options(k,empty='Select'){return [['',empty],...(records[k]||[]).map(x=>[x.id,k==='customers'?x.name:k==='vehicles'?vName(x.id):k==='jobs'?(cName(x.customer_id)+' — '+(x.complaint||'Work order')):x.description||x.invoice_number||x.id])]}
function invoiceTotal(inv){let items=(records.items||[]).filter(x=>x.invoice_id===inv.id),sub=items.reduce((a,x)=>a+n(x.quantity)*n(x.unit_price),0),tax=items.filter(x=>x.taxable).reduce((a,x)=>a+n(x.quantity)*n(x.unit_price)*n(inv.tax_rate),0);return {sub,tax,total:sub+tax+n(inv.service_fee)}}
function invoicePaid(id){return (records.payments||[]).filter(x=>x.invoice_id===id&&!x.voided_at).reduce((a,x)=>a+n(x.amount),0)}
function dashboard(){let inv=(records.invoices||[]).filter(i=>i.status!=='void'),due=inv.reduce((a,i)=>a+Math.max(0,invoiceTotal(i).total-invoicePaid(i.id)),0);return `<div class="panel"><h2>Business overview</h2><div class="stats"><div class="stat">Customers<b>${records.customers?.length||0}</b></div><div class="stat">Invoices<b>${inv.length}</b></div><div class="stat">Outstanding<b>${money(due)}</b></div></div><div class="actions"><button onclick="go('customer-edit')">+ Customer</button><button onclick="go('invoice-edit')">+ Invoice</button><button onclick="go('job-edit')">+ Work order</button></div></div><div class="panel"><h2>Recent invoices</h2>${inv.slice(-8).reverse().map(i=>`<div class="list"><div>#${i.invoice_number} · ${esc(cName(i.customer_id))}<div class="muted">${esc(i.status)}</div></div><button onclick="go('invoice-view','${i.id}')">${money(invoiceTotal(i).total)}</button></div>`).join('')||'No invoices yet.'}</div>`}
function listing(k,title,display){return `<div class="panel"><h2>${title}</h2><button onclick="go('${k==='parts'?'part':k.slice(0,-1)}-edit')">+ Add</button>${(records[k]||[]).map(x=>`<div class="list"><div>${display(x)}</div><button class="secondary" onclick="go('${k==='parts'?'part':k.slice(0,-1)}-edit','${x.id}')">Edit</button>${k==='jobs'?`<button onclick="createInvoiceFromJob('${x.id}')">Invoice</button>`:''}</div>`).join('')||'<p class="muted">No records yet.</p>'}</div>`}
const makes=['Audi','Acura','Alfa Romeo','BMW','Buick','Cadillac','Chevrolet','Chrysler','Dodge','Fiat','Ford','Genesis','GMC','Honda','Hyundai','Infiniti','Jaguar','Jeep','Kia','Land Rover','Lexus','Lincoln','Mazda','Mercedes-Benz','Mini','Mitsubishi','Nissan','Porsche','Ram','Subaru','Tesla','Toyota','Volkswagen','Volvo','Other'];
function editor(k){let item=(records[k]||[]).find(x=>x.id===edit)||{};let fields='';if(k==='customers')fields=`${formField('Customer name','name',item.name,'text','required')}${formField('Phone','phone',item.phone,'tel')}${formField('Email','email',item.email,'email')}${formField('Address','address',item.address)}${formField('Preferred labor rate ($/hour)','preferred_labor_rate',item.preferred_labor_rate,'number','min="0" step="0.01"')}${formField('Notes','notes',item.notes)}`;
if(k==='vehicles')fields=`${selectField('Customer','customer_id',options('customers'),item.customer_id,'required')}${formField('VIN (17 characters)','vin',item.vin,'text','maxlength="17" autocapitalize="characters"')}<div><button type="button" onclick="verifyVin()">Verify VIN & Auto-Fill</button><p id="vin-result" class="muted" role="status">NHTSA lookup requires internet. Review results before saving.</p></div>${formField('Tag / license plate','plate',item.plate)}${selectField('Year','year',Array.from({length:90},(_,i)=>String(2028-i)),item.year||2026,'onchange="loadVehicleModels()"')}${selectField('Make','make',makes,item.make||'Audi','onchange="loadVehicleModels()"')}<label>Model<select name="model" id="vehicle-model" required><option value="${esc(item.model||'')}">${esc(item.model||'Select a model')}</option></select></label><div><button type="button" class="secondary" onclick="loadVehicleModels()">Refresh models</button><p id="model-result" class="muted">Models load from NHTSA for the selected make and year. Choose Other for manual entry.</p></div>${formField('Custom model (if not listed)','custom_model','')}${formField('Trim','trim',item.trim)}${formField('Engine size (e.g. 2.0L)','engine_size',item.engine_size)}${formField('Engine cylinders','engine_cylinders',item.engine_cylinders,'number','min="1" max="16"')}${formField('Fuel type','fuel_type',item.fuel_type)}${formField('Mileage','mileage',item.mileage,'number','min="0"')}`;

if(k==='parts')fields=`${formField('Part description','description',item.description,'text','required')}${formField('SKU / part number','sku',item.sku)}${formField('Supplier','supplier',item.supplier)}${formField('Cost','cost',item.cost||0,'number','min="0" step="0.01"')}${formField('Selling price','sale_price',item.sale_price||0,'number','min="0" step="0.01"')}${formField('Quantity in stock','quantity_on_hand',item.quantity_on_hand||0,'number','step="0.01"')}`;
if(k==='jobs')fields=`${selectField('Customer','customer_id',options('customers'),item.customer_id,'required')}${selectField('Vehicle','vehicle_id',options('vehicles','None'),item.vehicle_id)}${selectField('Status','status',['estimate','approved','in_progress','completed','cancelled'],item.status||'estimate')}${formField('Customer complaint','complaint',item.complaint)}${formField('Diagnosis','diagnosis',item.diagnosis)}${formField('Work performed','work_performed',item.work_performed)}`;
if(k==='invoices')fields=`${selectField('Customer','customer_id',options('customers'),item.customer_id,'required')}${selectField('Vehicle','vehicle_id',options('vehicles','None'),item.vehicle_id)}${selectField('Work order','job_id',options('jobs','None'),item.job_id)}<p class="muted">Choosing a work order automatically copies its priced parts and labor when you save this new invoice.</p>${selectField('Status','status',['draft','sent','partially_paid','paid'],item.status||'draft')}${formField('Hourly labor rate','labor_rate',item.labor_rate??settings.labor_rate,'number','min="0" step="0.01"')}${formField('Mobile service fee','service_fee',item.service_fee??settings.service_fee,'number','min="0" step="0.01"')}${formField('Tax rate (%)','tax_percent',n(item.tax_rate??settings.default_tax_rate)*100,'number','min="0" max="100" step="0.01"')}${formField('Notes','notes',item.notes)}`;
return `<div class="panel"><h2>${edit?'Edit':'New'} ${k.slice(0,-1)}</h2><form onsubmit="saveRecord(event,'${k}')"><div class="grid">${fields}</div><div class="actions"><button>Save</button><button type="button" class="secondary" onclick="go('${k}')">Cancel</button></div></form>${k==='jobs'&&edit?jobItemsPanel(item):''}</div>${['vehicles','jobs','parts'].includes(k)?supplierLinks():''}`}

let modelRequestId=0;
async function loadVehicleModels(){
 const form=document.querySelector('#app form');if(!form||!form.elements.namedItem('make')||!form.elements.namedItem('year'))return;
 const make=form.elements.namedItem('make').value,year=form.elements.namedItem('year').value,select=form.elements.namedItem('model'),status=$('model-result');
 const previous=select.value, requestId=++modelRequestId;
 select.innerHTML='<option value="">Loading models…</option>';status.textContent='Loading model list from NHTSA…';
 try{
 const key='fmg_models_'+make+'_'+year;let models=JSON.parse(sessionStorage.getItem(key)||'null');
 if(!models){const url='https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/'+encodeURIComponent(make)+'/modelyear/'+encodeURIComponent(year)+'?format=json';let res=await fetch(url);if(!res.ok)throw Error('NHTSA returned '+res.status);let data=await res.json();models=[...new Set((data.Results||[]).map(x=>String(x.Model_Name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));try{sessionStorage.setItem(key,JSON.stringify(models))}catch{}}
 if(requestId!==modelRequestId)return;
 select.innerHTML='<option value="">Select model</option>'+models.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'<option value="Other">Other / manual entry</option>';
 if(previous&&!models.includes(previous)){select.add(new Option(previous,previous))}select.value=previous||'';
 status.textContent=models.length?models.length+' models available. Engine size can be verified using VIN or entered manually.':'No models returned; choose Other and enter a custom model.';
 }catch(e){if(requestId!==modelRequestId)return;select.innerHTML='<option value="Other">Other / manual entry</option>';if(previous){select.add(new Option(previous,previous));select.value=previous}status.textContent='Model lookup unavailable: '+e.message+'. Enter a custom model.'}
}
function supplierLinks(){return `<div class="panel no-print"><h3>Find parts online</h3><p class="muted">Opens supplier websites; prices and fitment are not automatically imported. Confirm the vehicle and part before ordering.</p><div class="actions">${[['O’Reilly','https://www.oreillyauto.com/'],['AutoZone','https://www.autozone.com/'],['Advance Auto Parts','https://shop.advanceautoparts.com/'],['NAPA','https://www.napaonline.com/']].map(([name,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:#d9e7ee;color:#173b50;border-radius:9px;padding:11px 14px;font-weight:650">${name} ↗</a>`).join('')}</div></div>`}
async function verifyVin(){
 const form=document.querySelector('#app form'),input=form?.elements.namedItem('vin'),el=$('vin-result');
 const vin=String(input?.value||'').trim().toUpperCase();if(input)input.value=vin;
 if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){el.textContent='VIN must contain 17 characters (excluding I, O, Q).';return}
 el.textContent='Checking VIN with NHTSA…';
 try{const response=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(vin)+'?format=json');
 if(!response.ok)throw Error('NHTSA service unavailable ('+response.status+')');
 const d=(await response.json()).Results?.[0];if(!d)throw Error('No vehicle data returned');
 const problems=String(d.ErrorCode||'').split(',').map(x=>x.trim()).filter(x=>x!=='0'&&x!=='');
 const fields=[['ModelYear','year'],['Make','make'],['Model','model'],['Trim','trim']];let filled=[];
 for(const [src,dest] of fields){let v=String(d[src]||'').trim();if(!v||v==='Not Applicable')continue;let control=form.elements.namedItem(dest);if(!control)continue;if(dest==='make'&&!Array.from(control.options).some(o=>o.value.toLowerCase()===v.toLowerCase())){control.add(new Option(v,v))}if(dest==='model'&&!Array.from(control.options).some(o=>o.value===v))control.add(new Option(v,v));control.value=v;filled.push(dest)}
 let engine=[d.DisplacementL?d.DisplacementL+'L':'',d.EngineCylinders?d.EngineCylinders+' cyl':''].filter(Boolean).join(' ');
 if(d.DisplacementL){form.elements.namedItem('engine_size').value=d.DisplacementL+'L';filled.push('engine size')}if(d.EngineCylinders){form.elements.namedItem('engine_cylinders').value=d.EngineCylinders;filled.push('cylinders')}if(d.FuelTypePrimary){form.elements.namedItem('fuel_type').value=d.FuelTypePrimary;filled.push('fuel type')}if(engine&&!d.Trim){form.elements.namedItem('trim').value=engine}
 vinResult={vin,issues:problems};
 el.textContent=(problems.length?'NHTSA reported possible VIN issues ('+problems.join(',')+'). ':'NHTSA lookup completed. ')+(filled.length?'Auto-filled '+filled.join(', ')+'. ':'No fields available. ')+'Review before saving.';
 }catch(e){el.textContent='VIN lookup failed: '+e.message+'. You may enter details manually.'}
}
function jobItemsPanel(job){const lines=(records.jobItems||[]).filter(x=>x.job_id===job.id);return `<hr><h3>Work-order charges</h3><p class="muted">Add parts and labor here. They will be copied to a new invoice.</p><form onsubmit="addJobItem(event)"><div class="grid three">${selectField('Charge type','item_type',[['part','Part'],['labor','Labor'],['fee','Fee'],['discount','Discount']])}${selectField('Inventory part (optional)','part_id',options('parts','Custom / no part'))}${formField('Description','description','','text','required')}${formField('Quantity / hours','quantity',1,'number','min="0.01" step="0.01" required')}${formField('Unit price / rate','unit_price',settings.labor_rate,'number','min="0" step="0.01" required')}${selectField('Taxable','taxable',[['false','No'],['true','Yes']])}</div><button>Add work-order charge</button></form>${lines.map(x=>`<div class="list"><div>${esc(x.item_type)} · ${esc(x.description)} · ${money(n(x.quantity)*n(x.unit_price))}</div><button type="button" class="secondary" onclick="deleteJobItem('${x.id}')">Remove</button></div>`).join('')}<button type="button" onclick="createInvoiceFromJob('${job.id}')">Create invoice from this work order</button>`}
async function addJobItem(ev){ev.preventDefault();let x=Object.fromEntries(new FormData(ev.target));x.job_id=edit;x.quantity=n(x.quantity);x.unit_price=n(x.unit_price);x.taxable=x.taxable==='true';if(!x.part_id)x.part_id=null;if(x.part_id){let p=records.parts.find(p=>p.id===x.part_id);if(p){x.description=x.description||p.description;x.unit_cost=p.cost}}if(x.item_type==='discount')x.unit_price=-Math.abs(x.unit_price);try{await insert('jobItems',x);await load()}catch(e){msg(e)}}
async function deleteJobItem(id){if(!confirm('Remove this work-order charge?'))return;try{await remove('jobItems',id);await load()}catch(e){msg(e)}}
async function createInvoiceFromJob(id,overrides={}){let job=records.jobs.find(x=>x.id===id);if(!job)return;let linked=records.invoices.find(x=>x.job_id===id&&x.status!=='void');if(linked&&!confirm('This work order already has an invoice. Create another?'))return;
 let obj={customer_id:job.customer_id,vehicle_id:job.vehicle_id||null,job_id:id,status:'draft',labor_rate:n(records.customers.find(c=>c.id===job.customer_id)?.preferred_labor_rate??settings.labor_rate),service_fee:n(settings.service_fee),tax_rate:n(settings.default_tax_rate),notes:[job.complaint&&'Complaint: '+job.complaint,job.diagnosis&&'Diagnosis: '+job.diagnosis,job.work_performed&&'Work performed: '+job.work_performed].filter(Boolean).join('\n'),...overrides};
 try{let created=(await insert('invoices',obj))[0];let lines=(records.jobItems||[]).filter(x=>x.job_id===id);
 if(!lines.length&&job.work_performed){lines=[{item_type:'labor',description:job.work_performed,quantity:1,unit_price:obj.labor_rate,taxable:false}];toast('Work order had no priced charges; review the draft labor line.')} 
 for(let line of lines){let {item_type,description,quantity,unit_price,unit_cost,taxable,part_id}=line;await insert('items',{invoice_id:created.id,item_type,description,quantity,unit_price,unit_cost:unit_cost??null,taxable,part_id:part_id||null})}
 await load();go('invoice-view',created.id)
 }catch(e){msg(e);toast('Invoice may have been created partially. Review invoices before retrying.')}}

async function saveRecord(ev,k){ev.preventDefault();let f=new FormData(ev.target),obj=Object.fromEntries(f.entries());for(let key of Object.keys(obj))if(obj[key]==='')obj[key]=null;if(k==='vehicles'){if(obj.custom_model?.trim())obj.model=obj.custom_model.trim();delete obj.custom_model;if(!obj.model||obj.model==='Other')return toast('Enter a vehicle model');obj.engine_cylinders=obj.engine_cylinders===null?null:n(obj.engine_cylinders);if(obj.vin){obj.vin=obj.vin.toUpperCase();if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(obj.vin))return toast('VIN must have 17 valid characters')}obj.year=n(obj.year);obj.mileage=obj.mileage===null?null:n(obj.mileage)}if(k==='invoices'){obj.tax_rate=n(obj.tax_percent)/100;delete obj.tax_percent;if(edit){let prior=records.invoices.find(i=>i.id===edit);if(prior?.status==='void')return toast('Voided invoices cannot be edited');if(records.payments.some(p=>p.invoice_id===edit&&!p.voided_at)&&obj.status==='draft')obj.status=prior.status;}if(!edit&&obj.job_id){return createInvoiceFromJob(obj.job_id,{labor_rate:obj.labor_rate,service_fee:obj.service_fee,tax_rate:obj.tax_rate,...(obj.notes?{notes:obj.notes}:{})})}}for(let key of ['labor_rate','service_fee','preferred_labor_rate','cost','sale_price','quantity_on_hand'])if(key in obj&&obj[key]!==null)obj[key]=n(obj[key]);try{if(edit)await update(k,edit,obj);else await insert(k,obj);await load();go(k)}catch(e){msg(e)}}
function invoiceView(){let i=records.invoices.find(x=>x.id===edit);if(!i)return '<div class="panel">Invoice not found</div>';let lines=records.items.filter(x=>x.invoice_id===i.id),t=invoiceTotal(i),paid=invoicePaid(i.id),voided=i.status==='void',balance=t.total-paid;
return `<div class="panel"><div class="actions no-print"><button onclick="window.print()">Print / Save PDF</button><button onclick="go('invoice-edit','${i.id}')" class="secondary">Edit invoice</button><button onclick="go('invoices')" class="secondary">Back</button>${i.status==='draft'&&!records.payments.some(p=>p.invoice_id===i.id)?`<button class="secondary" onclick="deleteDraftInvoice('${i.id}')">Delete draft</button>`:!voided?`<button class="secondary" onclick="voidInvoice('${i.id}')">Void invoice</button>`:''}</div><div class="printable"><h2>${esc(settings.business_name)}</h2><p>${esc(settings.business_address||'Mobile mechanic service')}</p><h2>Invoice #${i.invoice_number}${voided?' — VOID':''}</h2><p><b>Customer:</b> ${esc(cName(i.customer_id))}<br><b>Vehicle:</b> ${esc(vName(i.vehicle_id))}<br><b>Work order:</b> ${esc(i.job_id||'None')}<br><b>Status:</b> ${esc(i.status)}<br><b>Labor rate:</b> ${money(i.labor_rate)}/hour</p><div class="scroll"><table><tr><th>Type</th><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${lines.map(x=>`<tr><td>${esc(x.item_type)}</td><td>${esc(x.description)}</td><td>${x.quantity}</td><td>${money(x.unit_price)}</td><td>${money(n(x.quantity)*n(x.unit_price))}</td></tr>`).join('')}</table></div><p class="right">Items subtotal: ${money(t.sub)}<br>Tax: ${money(t.tax)}<br>Mobile service fee: ${money(i.service_fee)}<br><b>Total: ${money(t.total)}</b><br>Paid: ${money(paid)}<br><b>Balance: ${money(balance)}</b></p><p style="white-space:pre-wrap">${esc(i.notes)}</p></div><div class="no-print">${voided?'<p class="notice">Voided invoice. Charges and payments are read-only.</p>':`<h2>Invoice line items</h2><form onsubmit="addLine(event)"><div class="grid three">${selectField('Add charge','item_type',[['part','Part'],['labor','Labor'],['combined','Parts & Labor (two lines)'],['fee','Fee'],['discount','Discount']],'part','onchange="lineTypeChanged(this)"')}${selectField('Inventory part (optional)','part_id',options('parts','Custom / no part'),'','onchange="selectInvoicePart(this)"')}${formField('Description','description','','text','required')}${formField('Quantity / hours','quantity',1,'number','step="0.01" min="0.01" required')}${formField('Unit price / hourly rate','unit_price',i.labor_rate,'number','step="0.01" required')}${selectField('Taxable?','taxable',[['false','No'],['true','Yes']])}</div><div id="combined-fields" class="grid hide">${formField('Labor description','labor_description','Installation labor')}${formField('Labor hours','labor_hours',1,'number','min="0.01" step="0.01"')}${formField('Labor rate','labor_rate',i.labor_rate,'number','min="0" step="0.01"')}</div><button>Add charge</button></form>${lines.map(x=>`<div class="list"><div>${esc(x.description)} · ${money(n(x.quantity)*n(x.unit_price))}</div><button class="secondary" onclick="deleteLine('${x.id}')">Remove</button></div>`).join('')}<hr><h2>Record payment</h2><form onsubmit="addPayment(event)"><div class="grid">${selectField('Method','method',[['cash','Cash'],['zelle','Zelle'],['cash_app','Cash App']])}${formField('Amount','amount',Math.max(0,balance).toFixed(2),'number','min="0.01" step="0.01" required')}${formField('Transaction reference (optional)','reference')}</div><button ${balance<=0?'disabled':''}>Record payment</button></form>`}<h3>Payment history</h3>${records.payments.filter(x=>x.invoice_id===i.id).map(p=>`<div class="list"><div>${esc(p.method)} · ${money(p.amount)} · ${esc(p.reference||'')} ${p.voided_at?'<b>(REVERSED)</b>':''}</div>${!p.voided_at&&!voided?`<button class="secondary" onclick="reversePayment('${p.id}')">Reverse entry</button>`:''}</div>`).join('')}</div></div>`}
async function addLine(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));let inv=records.invoices.find(i=>i.id===edit);if(!inv||inv.status==='void')return toast('Voided invoice is locked');let combined=x.item_type==='combined';let labor={item_type:'labor',description:x.labor_description||'Installation labor',quantity:n(x.labor_hours),unit_price:n(x.labor_rate),taxable:false};delete x.labor_description;delete x.labor_hours;delete x.labor_rate;x.invoice_id=edit;x.quantity=n(x.quantity);x.unit_price=n(x.unit_price);x.taxable=x.taxable==='true';if(!x.part_id)x.part_id=null;if(x.part_id){let p=records.parts.find(p=>p.id===x.part_id);if(p)x.unit_cost=p.cost}if(combined)x.item_type='part';if(x.item_type==='discount')x.unit_price=-Math.abs(x.unit_price);try{await insert('items',x);if(combined)await insert('items',{...labor,invoice_id:edit});await load()}catch(err){msg(err);toast('Check line items before retrying; a partial save is possible.')}}
async function deleteLine(id){let inv=records.invoices.find(i=>i.id===edit);if(!inv||inv.status==='void')return;if(!confirm('Remove this line?'))return;try{await remove('items',id);await load()}catch(e){msg(e)}}
async function addPayment(e){e.preventDefault();let inv=records.invoices.find(i=>i.id===edit);if(!inv||inv.status==='void')return;let x=Object.fromEntries(new FormData(e.target));x.invoice_id=edit;x.amount=n(x.amount);let remaining=invoiceTotal(inv).total-invoicePaid(edit);if(x.amount>remaining+.009)return toast('Payment exceeds outstanding balance. Check amount.');try{await insert('payments',x);await load();await syncInvoiceStatus(edit)}catch(err){msg(err)}}

function lineTypeChanged(el){let f=el.form;let combined=el.value==='combined';$('combined-fields').classList.toggle('hide',!combined);if(el.value==='labor'){f.elements.namedItem('unit_price').value=records.invoices.find(i=>i.id===edit)?.labor_rate||settings.labor_rate;f.elements.namedItem('taxable').value='false'}if(el.value==='part'||combined)f.elements.namedItem('taxable').value='true'}
function selectInvoicePart(el){let p=records.parts.find(x=>x.id===el.value);if(!p)return;let f=el.form;f.elements.namedItem('description').value=p.description;f.elements.namedItem('unit_price').value=p.sale_price;f.elements.namedItem('taxable').value='true'}
async function syncInvoiceStatus(id){let inv=records.invoices.find(i=>i.id===id);if(!inv||inv.status==='void')return;let paid=invoicePaid(id),due=invoiceTotal(inv).total-paid;let status=paid<=0?'draft':due<=.009?'paid':'partially_paid';await update('invoices',id,{status});await load()}
async function reversePayment(id){let p=records.payments.find(p=>p.id===id);if(!p||p.voided_at)return;let reason=prompt('Reason for reversing this payment record (required):');if(!reason?.trim())return; if(!confirm('Reverse this recorded payment? This changes the invoice balance, but does NOT refund money in Zelle/Cash App/cash.'))return;try{await update('payments',id,{voided_at:new Date().toISOString(),void_reason:reason.trim()});await load();await syncInvoiceStatus(p.invoice_id);toast('Payment entry reversed; original retained in history')}catch(e){msg(e)}}
async function deleteDraftInvoice(id){let i=records.invoices.find(i=>i.id===id);if(!i||i.status!=='draft'||records.payments.some(p=>p.invoice_id===id))return toast('Only drafts without any payment history can be deleted');if(!confirm('Permanently delete this draft invoice and its line items?'))return;try{await remove('invoices',id);await load();go('invoices')}catch(e){msg(e)}}
async function voidInvoice(id){let i=records.invoices.find(i=>i.id===id);if(!i||i.status==='void')return;if(records.payments.some(p=>p.invoice_id===id&&!p.voided_at))return toast('Reverse/reconcile all payment records before voiding. This does not refund funds.');if(!confirm('Void invoice #'+i.invoice_number+'? It remains in history and will be excluded from financial totals.'))return;try{await update('invoices',id,{status:'void'});await load()}catch(e){msg(e)}}

let reportPeriod='monthly',reportYear=new Date().getFullYear(),reportBucket='all';
function reportDate(x){let d=new Date(x);return Number.isNaN(d.getTime())?null:d}
function reportPeriodKey(d,period){return period==='annual'?String(d.getFullYear()):period==='quarterly'?`${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function reportFilterDate(date){let d=reportDate(date);if(!d||d.getFullYear()!==reportYear)return false;return reportBucket==='all'||reportPeriodKey(d,reportPeriod)===reportBucket}
function reportOptions(){let keys=reportPeriod==='annual'?[String(reportYear)]:reportPeriod==='quarterly'?Array.from({length:4},(_,i)=>`${reportYear}-Q${i+1}`):Array.from({length:12},(_,i)=>`${reportYear}-${String(i+1).padStart(2,'0')}`);return [['all','Entire year'],...keys.map(k=>[k,k])]}
function changeReportPeriod(v){reportPeriod=v;reportBucket='all';render()}
function changeReportYear(v){reportYear=Number(v);reportBucket='all';render()}
function changeReportBucket(v){reportBucket=v;render()}
function reportData(){let invoices=(records.invoices||[]).filter(i=>i.status!=='void');let byId=new Map(invoices.map(i=>[i.id,i]));let billed=invoices.filter(i=>reportFilterDate(i.created_at));let payments=(records.payments||[]).filter(p=>!p.voided_at&&byId.has(p.invoice_id)&&reportFilterDate(p.paid_at||p.created_at));let invoiceTax=billed.reduce((a,i)=>a+invoiceTotal(i).tax,0);let billedGross=billed.reduce((a,i)=>a+invoiceTotal(i).total,0);let received=payments.reduce((a,p)=>a+n(p.amount),0);let taxReceived=payments.reduce((a,p)=>{let t=invoiceTotal(byId.get(p.invoice_id));return a+(t.total>0?n(p.amount)*t.tax/t.total:0)},0);let outstanding=billed.reduce((a,i)=>a+Math.max(0,invoiceTotal(i).total-invoicePaid(i.id)),0);return {invoiceTax,billedGross,received,taxReceived,outstanding,netReceived:received-taxReceived,billedCount:billed.length,paymentCount:payments.length}}
function reports(){let r=reportData();let opts=reportOptions();return `<div class="panel"><h2>Financial Reports & Sales Tax</h2><div class="grid three">${selectField('Report period','report_period',[['monthly','Monthly'],['quarterly','Quarterly'],['annual','Annual']],reportPeriod,'onchange="changeReportPeriod(this.value)"')}${selectField('Year','report_year',Array.from({length:11},(_,i)=>String(new Date().getFullYear()+1-i)),reportYear,'onchange="changeReportYear(this.value)"')}${selectField('Period','report_bucket',opts,reportBucket,'onchange="changeReportBucket(this.value)"')}</div><div class="stats"><div class="stat">Invoiced including tax<b>${money(r.billedGross)}</b></div><div class="stat">Payments received<b>${money(r.received)}</b></div><div class="stat">Sales tax on invoices<b>${money(r.invoiceTax)}</b></div><div class="stat">Estimated tax in receipts<b>${money(r.taxReceived)}</b></div><div class="stat">Receipts excluding tax<b>${money(r.netReceived)}</b></div><div class="stat">Unpaid balance on period invoices<b>${money(r.outstanding)}</b></div></div><p class="muted">${r.billedCount} invoices issued; ${r.paymentCount} active payment entries received in the selected period.</p><div class="actions no-print"><button onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="exportReportCSV()">Export CSV</button></div><p class="notice">Sales tax on invoices is calculated from taxable invoice lines. Estimated tax in receipts allocates each payment proportionally across the invoice total, including tax; it is not an official tax liability calculation. Payments are grouped by payment date, invoices by creation date. Outstanding balance is for invoices created during the period, as of today. No sales-tax remittance tracking is available yet. Verify tax jurisdiction, taxability, returns, refunds and actual remittances with your accountant. This is an operational report, not a tax return.</p></div>`}
function exportReportCSV(){let r=reportData();let rows=[['FMG Financial Report',reportPeriod,reportYear,reportBucket],['Metric','USD'],['Invoiced including tax',r.billedGross],['Payments received',r.received],['Sales tax on invoices',r.invoiceTax],['Estimated tax in receipts',r.taxReceived],['Receipts excluding tax',r.netReceived],['Unpaid balance on period invoices',r.outstanding],['Invoices',r.billedCount],['Payments',r.paymentCount]];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`FMG_report_${reportYear}_${reportPeriod}_${reportBucket}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settingsPage(){return `<div class="panel"><h2>Business settings</h2><form onsubmit="saveBusiness(event)"><div class="grid">${formField('Business name','business_name',settings.business_name)}${formField('Business address','business_address',settings.business_address)}${formField('Default hourly labor rate','labor_rate',settings.labor_rate,'number','min="0" step="0.01"')}${formField('Mobile service fee','service_fee',settings.service_fee,'number','min="0" step="0.01"')}${formField('Initial tax rate (%)','tax_percent',n(settings.default_tax_rate)*100,'number','min="0" max="100" step="0.01"')}</div><button>Save settings</button></form><p class="notice">Tax is applied only to invoice lines marked taxable. Confirm applicable tax treatment with a qualified tax adviser.</p></div><div class="panel"><h2>Security</h2><p>Cloud access requires a Supabase owner session. Your PIN only unlocks a device that is already signed in.</p><button class="secondary" onclick="lockNow()">Lock now</button> <button class="secondary" onclick="resetPin()">Reset device PIN</button></div>`}
async function saveBusiness(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.default_tax_rate=n(x.tax_percent)/100;delete x.tax_percent;x.labor_rate=n(x.labor_rate);x.service_fee=n(x.service_fee);try{if(records.settings.length)await update('settings',records.settings[0].id,x);else await insert('settings',x);await load();toast('Settings saved')}catch(err){msg(err)}}
function render(){if(locked)return;document.querySelector('nav').classList.remove('hide');$('nav').innerHTML=nav();$('logout').style.display='';let content={dashboard,customers:()=>listing('customers','Customers',x=>`<b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone)}</span>`),vehicles:()=>listing('vehicles','Vehicles',x=>`<b>${esc(vName(x.id))}</b><br><span class="muted">VIN ${esc(x.vin)} · ${esc(cName(x.customer_id))}</span>`),parts:()=>listing('parts','Parts inventory',x=>`<b>${esc(x.description)}</b> · ${money(x.sale_price)}<br><span class="muted">${esc(x.sku)} · Stock ${x.quantity_on_hand}</span>`),jobs:()=>listing('jobs','Work orders',x=>`<b>${esc(cName(x.customer_id))}</b> · ${esc(x.status)}<br>${esc(x.complaint)}`),invoices:()=>listing('invoices','Invoices',x=>`<b>#${x.invoice_number}</b> · ${esc(cName(x.customer_id))} · ${money(invoiceTotal(x).total)} <button onclick="go('invoice-view','${x.id}')">View</button>`),reports,settings:settingsPage,'customer-edit':()=>editor('customers'),'vehicle-edit':()=>editor('vehicles'),'part-edit':()=>editor('parts'),'job-edit':()=>editor('jobs'),'invoice-edit':()=>editor('invoices'),'invoice-view':invoiceView};$('app').innerHTML=(content[screen]||dashboard)();if(screen==='vehicle-edit')loadVehicleModels();if(['parts','vehicles','jobs','invoice-view'].includes(screen))$('app').insertAdjacentHTML('beforeend',supplierLinks())}
function showLogin(){document.querySelector('nav').classList.add('hide');$('logout').style.display='none';$('app').innerHTML=`<div class="panel lock"><h2>FMG Owner Sign In</h2><p class="muted">Sign in on this trusted device. Your session can stay signed in across browser restarts; use your PIN to unlock afterward.</p><form onsubmit="login(event)">${formField('Supabase account email','email','','email','required autocomplete="username"')}${formField('Password','password','','password','required autocomplete="current-password"')}<button>Secure sign in</button></form></div>`}
const pinKey='fmg_pin_verifier_v3';let pinInput='',pinStage='unlock',firstPin='';
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
async function derive(pin,salt){let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:250000,hash:'SHA-256'},key,256))}
async function initLock(){pinStage=localStorage.getItem(pinKey)?'unlock':'new';pinInput='';showLock()}
function showLock(){document.querySelector('nav').classList.add('hide');$('logout').style.display='';let title={unlock:'Enter your 4-digit PIN',new:'Create your 4-digit PIN',confirm:'Confirm your PIN'}[pinStage];$('app').innerHTML=`<div class="panel lock"><h2>${title}</h2><p class="muted">The PIN is configured separately on each device. You may choose the same PIN, but never share it in chat.</p><div class="dots">${'●'.repeat(pinInput.length)}${'○'.repeat(4-pinInput.length)}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(d=>d?`<button onclick="pinTap('${d}')">${d}</button>`:'<span></span>').join('')}</div><p class="muted">PIN is a convenience lock, not a replacement for secure Supabase sign-in.</p><button class="secondary" onclick="signOut()">Sign out / account recovery</button></div>`}
async function pinTap(d){if(d==='⌫'){pinInput=pinInput.slice(0,-1);showLock();return}if(pinInput.length>=4)return;pinInput+=d;showLock();if(pinInput.length!==4)return;let pin=pinInput;pinInput='';if(pinStage==='new'){firstPin=pin;pinStage='confirm';showLock();return}if(pinStage==='confirm'){if(pin!==firstPin){pinStage='new';firstPin='';toast('PINs did not match');showLock();return}let salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem(pinKey,JSON.stringify({salt,hash:await derive(pin,salt)}));firstPin='';locked=false;await load();return}let obj=JSON.parse(localStorage.getItem(pinKey));let failures=JSON.parse(localStorage.getItem('fmg_pin_failures')||'{"count":0,"until":0}');if(Date.now()<failures.until){toast('Too many attempts. Sign out and sign in securely to recover.');showLock();return}if(await derive(pin,obj.salt)===obj.hash){localStorage.removeItem('fmg_pin_failures');locked=false;await load()}else{failures.count++;if(failures.count>=5){failures.until=Date.now()+15*60*1000;failures.count=0}localStorage.setItem('fmg_pin_failures',JSON.stringify(failures));toast('Incorrect PIN');showLock()}}
function lockNow(){locked=true;initLock()}
function resetPin(){if(!confirm('Reset this device PIN? You will need to create a new one.'))return;localStorage.removeItem(pinKey);lockNow()}
async function signOut(){session=null;locked=true;records={};clearSession();showLogin()}
let idle;function activity(){if(!locked&&session){clearTimeout(idle);idle=setTimeout(lockNow,5*60*1000)}}['pointerdown','keydown'].forEach(x=>document.addEventListener(x,activity));document.addEventListener('visibilitychange',()=>{if(document.hidden&&session&&!locked)lockNow()});
(async()=>{try{session=JSON.parse(localStorage.getItem('fmg_trusted_session_v4')||sessionStorage.getItem('fmg_session')||'null')}catch{session=null}if(!session){showLogin();return}try{if(!session.refresh_token)throw Error('No refresh token');if(!session.expires_at||session.expires_at*1000<Date.now()+120000){if(!(await refresh()))throw Error('Session expired')}if(!(await ownerAuthorized()))throw Error('Account not authorized');persistSession();locked=true;await initLock()}catch(e){session=null;clearSession();showLogin();toast('Please sign in again to renew your trusted-device session.')}})();
</script></body></html>
